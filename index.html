<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>夜のビル街 - Three.js</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Orbitron:wght@500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; overflow: hidden; background: #05070d; }
  canvas { display: block; }
  .ui { position: fixed; right: 16px; bottom: 16px; z-index: 3; display: flex; gap: 8px; }
  .ui button, .ui a {
    font: 600 13px/1 system-ui, sans-serif; color: #e8ecff; text-decoration: none;
    background: rgba(10, 12, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 6px; padding: 9px 12px; cursor: pointer;
  }
  .ui button:hover, .ui a:hover { background: rgba(40, 44, 60, 0.8); }
</style>
</head>
<body>
<script src="cover.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const NEON_COLORS = [0xff2ec4, 0x2ef7ff, 0x39ff14, 0xffce29, 0xff5a2e];

const FOG_COLOR = 0x0d0e12;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0055);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 1, 2000);
const lookTarget = new THREE.Vector3(0, 100, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ===== ポストプロセス：ネオンのにじみ(ブルーム) + ピント外ボケ(被写界深度) =====
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.95,  // strength
  0.5,   // radius
  0.4    // threshold
);
composer.addPass(bloomPass);

const bokehPass = new BokehPass(scene, camera, {
  focus: 240,
  aperture: 0.0007,
  maxblur: 0.007,
  width: window.innerWidth,
  height: window.innerHeight,
});
composer.addPass(bokehPass);
composer.addPass(new OutputPass());

// ===== 地面（雨で濡れた路面っぽく反射気味に＋街灯ドットで密度感を出す） =====
function makeGroundLightsTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0000';
  ctx.clearRect(0, 0, size, size);

  ctx.strokeStyle = 'rgba(70,90,120,0.25)';
  ctx.lineWidth = 1.5;
  const cell = 64;
  for (let x = 0; x <= size; x += cell) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, size); ctx.stroke();
  }
  for (let y = 0; y <= size; y += cell) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
  }

  for (let x = 0; x <= size; x += cell) {
    for (let y = 0; y <= size; y += cell) {
      if (Math.random() < 0.6) {
        ctx.fillStyle = Math.random() < 0.7 ? 'rgba(255,220,150,0.9)' : 'rgba(140,200,255,0.85)';
        ctx.beginPath();
        ctx.arc(x, y, 2 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(40, 40);
  return texture;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({
    color: 0x11141e, roughness: 0.2, metalness: 0.45,
    emissiveMap: makeGroundLightsTexture(), emissive: 0xffffff, emissiveIntensity: 0.9,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 瞬く煌めきレイヤーを2枚重ねて、互い違いにフェードさせることで地面全体が瞬いているように見せる
function makeGroundTwinkleLayer(seedOffset) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 1 + Math.random() * 2.5;
    const color = NEON_COLORS[(i + seedOffset) % NEON_COLORS.length];
    ctx.fillStyle = new THREE.Color(color).getStyle();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(30, 30);
  const mat = new THREE.MeshBasicMaterial({
    map: texture, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: true,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.05;
  scene.add(mesh);
  return mesh;
}
const groundTwinkleA = makeGroundTwinkleLayer(0);
const groundTwinkleB = makeGroundTwinkleLayer(2);

const ambient = new THREE.AmbientLight(0x33406a, 0.58);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0x8899ff, 0.35);
moon.position.set(-100, 200, -100);
moon.castShadow = true;
moon.shadow.bias = -0.0005;
moon.shadow.mapSize.set(2048, 2048);
scene.add(moon);

// ===== 夜空を覆う厚い雲（頭上の巨大な平面に描画し、下向きに見せる） =====
function makeCloudCeiling() {
  const size = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  // ベースの雲底（隙間なく塗りつぶす、灰色系）
  ctx.fillStyle = '#1c1e22';
  ctx.fillRect(0, 0, size, size);

  // 大きな塊で厚みを表現（不透明度高め・重ねて凹凸感、グレー〜スレート系）
  const stormColors = ['#232529', '#2a2c30', '#1a1c1f', '#26282c', '#141517'];
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 120 + Math.random() * 260;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    const c = stormColors[Math.floor(Math.random() * stormColors.length)];
    grad.addColorStop(0, c);
    grad.addColorStop(0.7, c);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.55 + Math.random() * 0.35;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 街の灯りが雲の底面を照らしているようなオレンジ〜ピンクのにじみ
  const glowGrad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.42);
  glowGrad.addColorStop(0, 'rgba(255,140,90,0.28)');
  glowGrad.addColorStop(0.5, 'rgba(200,80,160,0.12)');
  glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, size, size);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 3);

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(4000, 4000),
    new THREE.MeshBasicMaterial({ map: texture, fog: true })
  );
  plane.rotation.x = Math.PI / 2; // 下向きにして見上げたときに見えるようにする
  plane.position.y = 420;
  return { plane, texture };
}
const cloudCeiling = makeCloudCeiling();
scene.add(cloudCeiling.plane);

// ===== 雨（垂直に落ちる線分を大量に降らせてループさせる） =====
function makeRain() {
  const count = 7000;
  const positions = new Float32Array(count * 2 * 3);
  const speeds = new Float32Array(count);
  const lengths = new Float32Array(count);

  function reset(i) {
    const r = Math.sqrt(Math.random()) * 380;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    const y = 40 + Math.random() * 240;
    const len = 1.2 + Math.random() * 2.4;
    positions[i * 6 + 0] = x; positions[i * 6 + 1] = y;       positions[i * 6 + 2] = z;
    positions[i * 6 + 3] = x; positions[i * 6 + 4] = y - len; positions[i * 6 + 5] = z;
    lengths[i] = len;
    speeds[i] = 70 + Math.random() * 70;
  }
  for (let i = 0; i < count; i++) reset(i);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0x9fc0e6, transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: true,
  });
  const mesh = new THREE.LineSegments(geo, mat);
  scene.add(mesh);

  return {
    mesh,
    update(dt) {
      const pos = geo.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const dy = speeds[i] * dt;
        pos[i * 6 + 1] -= dy;
        pos[i * 6 + 4] -= dy;
        if (pos[i * 6 + 1] < 0) reset(i);
      }
      geo.attributes.position.needsUpdate = true;
    },
  };
}
const rain = makeRain();

// 点滅する航空障害灯（赤）を格納する配列
const beacons = [];
// 点滅するネオン看板を格納する配列
const neonSigns = [];

// ===== 建物の壁面テクスチャ（窓・配管・室外機・ネオン看板を敷き詰めて空き面を作らない） =====
function makeFacadeTexture(width, height) {
  const cw = 256, ch = 512;
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#12141d';
  ctx.fillRect(0, 0, cw, ch);

  // 窓グリッド（密度高め）
  const cols = Math.max(3, Math.floor(width / 1.0));
  const rows = Math.max(4, Math.floor(height / 1.2));
  const cellW = cw / cols, cellH = ch / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.72) {
        const hue = Math.random() < 0.8 ? '#ffdd88' : '#88ccff';
        ctx.globalAlpha = 0.45 + Math.random() * 0.55;
        ctx.fillStyle = hue;
        ctx.fillRect(c * cellW + 1, r * cellH + 1, cellW - 2, cellH - 2);
      } else {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#0a0b11';
        ctx.fillRect(c * cellW + 1, r * cellH + 1, cellW - 2, cellH - 2);
      }
    }
  }
  ctx.globalAlpha = 1;

  // 縦配管
  const pipeCount = 2 + Math.floor(Math.random() * 4);
  for (let i = 0; i < pipeCount; i++) {
    const x = Math.random() * cw;
    const w = 3 + Math.random() * 4;
    ctx.fillStyle = Math.random() < 0.5 ? '#3a4250' : '#4a3428';
    ctx.fillRect(x, 0, w, ch);
    // 配管の継ぎ目
    for (let y = 0; y < ch; y += 40 + Math.random() * 30) {
      ctx.fillStyle = '#20242e';
      ctx.fillRect(x - 2, y, w + 4, 5);
    }
  }

  // 室外機・ダクト（暗い箱＋グレート線）
  const acCount = 4 + Math.floor(Math.random() * 8);
  for (let i = 0; i < acCount; i++) {
    const w = 14 + Math.random() * 18;
    const h = 8 + Math.random() * 10;
    const x = Math.random() * (cw - w);
    const y = Math.random() * (ch - h);
    ctx.fillStyle = '#05060a';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#2a2e38';
    ctx.lineWidth = 1;
    for (let gx = 2; gx < w - 2; gx += 4) {
      ctx.beginPath();
      ctx.moveTo(x + gx, y + 1);
      ctx.lineTo(x + gx, y + h - 1);
      ctx.stroke();
    }
  }

  // ネオン看板（発光を強めに、canvas内でshadowBlurを使ってにじみを焼き込む）
  const neonRects = [];
  if (Math.random() < 0.45) {
    const signCount = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < signCount; i++) {
      const w = 30 + Math.random() * 60;
      const h = 14 + Math.random() * 20;
      const x = Math.random() * (cw - w);
      const y = Math.random() * (ch - h);
      const color = ['#ff2ec4', '#2ef7ff', '#39ff14', '#ffce29', '#ff5a2e'][Math.floor(Math.random() * 5)];

      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 22;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.9;
      // 「文字っぽい」縞模様で看板らしく
      const bars = 3 + Math.floor(Math.random() * 4);
      const barW = w / bars;
      for (let b = 0; b < bars; b++) {
        if (Math.random() < 0.8) {
          ctx.fillRect(x + b * barW + 1, y, barW - 2, h);
        }
      }
      ctx.restore();
      neonRects.push({ x, y, w, h });
    }
  }
  ctx.globalAlpha = 1;

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = 8;
  texture.generateMipmaps = true;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;

  return { texture, hasNeon: neonRects.length > 0 };
}

// 窓・壁が光るビルを作るヘルパー（glowScaleで発光の強さを調整。中心タワーを一番目立たせる用）
function makeBuilding(width, height, depth, { shadow = true, glowScale = 1, roofSign = true, cornerLights = false } = {}) {
  const group = new THREE.Group();

  // 屋上四隅の航空障害灯（ビルごとに4つ同時に点滅）
  if (cornerLights) {
    const phase = Math.random() * 1000;
    const r = Math.max(0.5, Math.min(width, depth) * 0.05);
    for (const [cx, cz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
      const cornerLight = new THREE.Mesh(
        new THREE.SphereGeometry(r, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff2222 })
      );
      cornerLight.position.set(cx * width * 0.47, height + r, cz * depth * 0.47);
      group.add(cornerLight);
      beacons.push({ mesh: cornerLight, light: null, phase, baseIntensity: 0 });
    }
  }

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x10131c, roughness: 0.6, metalness: 0.3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
  body.position.y = height / 2;
  body.castShadow = shadow;
  body.receiveShadow = true;
  group.add(body);

  const { texture, hasNeon } = makeFacadeTexture(width, height);
  const facadeMat = new THREE.MeshStandardMaterial({
    map: texture,
    emissiveMap: texture,
    emissive: 0xffffff,
    emissiveIntensity: 1.0 * glowScale,
    roughness: 0.45,
    polygonOffset: true,
    polygonOffsetFactor: -1,
    polygonOffsetUnits: -1,
  });

  const faceGeo = new THREE.PlaneGeometry(width * 0.98, height * 0.98);
  const offsets = [
    { pos: [0, height / 2, depth / 2 + 0.05], rot: [0, 0, 0] },
    { pos: [0, height / 2, -depth / 2 - 0.05], rot: [0, Math.PI, 0] },
  ];
  const faceGeoSide = new THREE.PlaneGeometry(depth * 0.98, height * 0.98);
  const offsetsSide = [
    { pos: [width / 2 + 0.05, height / 2, 0], rot: [0, Math.PI / 2, 0] },
    { pos: [-width / 2 - 0.05, height / 2, 0], rot: [0, -Math.PI / 2, 0] },
  ];
  for (const o of offsets) {
    const face = new THREE.Mesh(faceGeo, facadeMat);
    face.position.set(...o.pos);
    face.rotation.set(...o.rot);
    group.add(face);
  }
  for (const o of offsetsSide) {
    const face = new THREE.Mesh(faceGeoSide, facadeMat);
    face.position.set(...o.pos);
    face.rotation.set(...o.rot);
    group.add(face);
  }

  // ネオン看板を1枚生成して取り付けるヘルパー（色をHDR的に明るくしてbloomがしっかり拾ってにじむように）
  function addNeonSign(w, h, pos, rotY) {
    const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    const brightColor = new THREE.Color(color).multiplyScalar(3.4);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: brightColor, transparent: true, opacity: Math.min(1, 0.95 * glowScale), side: THREE.DoubleSide })
    );
    sign.position.copy(pos);
    sign.rotation.y = rotY;
    group.add(sign);
    neonSigns.push({ mesh: sign, phase: Math.random() * 1000, baseColor: color });
  }

  // 側面（前後左右どちらか）に突き出す看板
  if (hasNeon || Math.random() < 0.28) {
    const signW = Math.min(width, depth) * (0.5 + Math.random() * 0.4);
    const signH = 2 + Math.random() * 4;
    const side = Math.random() < 0.5 ? 1 : -1;
    const onXFace = Math.random() < 0.5;
    if (onXFace) {
      addNeonSign(signW, signH, new THREE.Vector3(side * (width / 2 + 0.3), height * (0.3 + Math.random() * 0.4), 0), side > 0 ? Math.PI / 2 : -Math.PI / 2);
    } else {
      addNeonSign(signW, signH, new THREE.Vector3(0, height * (0.3 + Math.random() * 0.4), side * (depth / 2 + 0.3)), side > 0 ? 0 : Math.PI);
    }
  }
  // もう一面にも看板を足して看板だらけ感を出す
  if (Math.random() < 0.38) {
    const signW = Math.min(width, depth) * (0.4 + Math.random() * 0.35);
    const signH = 1.5 + Math.random() * 3;
    const side = Math.random() < 0.5 ? 1 : -1;
    addNeonSign(signW, signH, new THREE.Vector3(0, height * (0.15 + Math.random() * 0.55), side * (depth / 2 + 0.3)), side > 0 ? 0 : Math.PI);
  }

  // 屋上に自立するネオン看板（正方形〜横長のパネル、ビルの上に突き出た広告塔）
  if (roofSign && Math.random() < 0.35) {
    const signH = 5 + Math.random() * 5;
    const signW = signH * (1.0 + Math.random() * 1.4); // 正方形〜横長
    addNeonSign(
      signW, signH,
      new THREE.Vector3(0, height + signH / 2 + 2, 0),
      Math.random() * Math.PI
    );
  }

  // ビル側面に縦長のネオン看板（日本のビルによくある短冊状の袖看板）をランダムに設置
  const verticalSignCount = Math.random() < 0.5 ? (Math.random() < 0.5 ? 1 : 2) : 0;
  for (let i = 0; i < verticalSignCount; i++) {
    const signW = 1.2 + Math.random() * 1.6;
    const signH = height * (0.12 + Math.random() * 0.15);
    const side = Math.random() < 0.5 ? 1 : -1;
    const onXFace = Math.random() < 0.5;
    const edgeBias = (0.6 + Math.random() * 0.3); // 建物の端寄りに配置
    const baseY = Math.random() * (height - signH) + signH / 2;
    if (onXFace) {
      addNeonSign(
        signW, signH,
        new THREE.Vector3(side * (width / 2 + 0.15), baseY, (depth / 2) * edgeBias * (Math.random() < 0.5 ? 1 : -1)),
        side > 0 ? Math.PI / 2 : -Math.PI / 2
      );
    } else {
      addNeonSign(
        signW, signH,
        new THREE.Vector3((width / 2) * edgeBias * (Math.random() < 0.5 ? 1 : -1), baseY, side * (depth / 2 + 0.15)),
        side > 0 ? 0 : Math.PI
      );
    }
  }

  // 屋上の雑多な設備（給水塔・室外機っぽい小箱）
  const clutterCount = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < clutterCount; i++) {
    const cw2 = width * (0.15 + Math.random() * 0.25);
    const ch2 = 1 + Math.random() * 3;
    const cd2 = depth * (0.15 + Math.random() * 0.25);
    const clutter = new THREE.Mesh(
      new THREE.BoxGeometry(cw2, ch2, cd2),
      new THREE.MeshStandardMaterial({ color: 0x1a1d26, roughness: 0.8 })
    );
    clutter.position.set(
      (Math.random() - 0.5) * (width - cw2),
      height + ch2 / 2,
      (Math.random() - 0.5) * (depth - cd2)
    );
    clutter.castShadow = shadow;
    group.add(clutter);
  }

  // 先端に赤く点滅する航空障害灯
  const beaconMesh = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(0.6, width * 0.04), 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff2222 })
  );
  beaconMesh.position.set(0, height + 1.5, 0);
  group.add(beaconMesh);

  let beaconLight = null;
  if (height > 90) {
    beaconLight = new THREE.PointLight(0xff2222, 1.5, height * 0.6 + 10);
    beaconLight.position.copy(beaconMesh.position);
    group.add(beaconLight);

const searchlights = [];
function makeSearchlightBeam(color) {
  const beamHeight = 260;
  const geo = new THREE.CylinderGeometry(1.0, 5.5, beamHeight, 20, 1, true);

  // 根本が明るく先端に向かって透明になるグラデーションを焼き込む
  const canvas = document.createElement('canvas');
  canvas.width = 8; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0.28)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const texture = new THREE.CanvasTexture(canvas);

  const mat = new THREE.MeshBasicMaterial({
    map: texture, color, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  });
  const beam = new THREE.Mesh(geo, mat);
  beam.position.y = beamHeight / 2;

  const group = new THREE.Group();
  group.add(beam);
  return group;
}

function addSearchlight(x, z, color) {
  const group = makeSearchlightBeam(color);
  group.position.set(x, 2, z);
  scene.add(group);
  const dir = new THREE.Vector2(x, z).normalize();
  searchlights.push({
    group,
    dir,
    baseOpacity: group.children[0].material.opacity,
    phaseX: Math.random() * Math.PI * 2,
    phaseZ: Math.random() * Math.PI * 2,
    speedX: 0.12 + Math.random() * 0.1,
    speedZ: 0.09 + Math.random() * 0.08,
    ampX: 0.22 + Math.random() * 0.16,
    ampZ: 0.3 + Math.random() * 0.18,

}

// ===== 高架高速道路（隙間を埋める。渋滞で赤（テールランプ）と白（ヘッドライト）が並ぶ） =====
const highways = [];

function buildElevatedHighway(points) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.15);

  // 道路デッキ本体
  const deckWidth = 11;
  const deckThickness = 1.4;
  const shape = new THREE.Shape();
  shape.moveTo(-deckWidth / 2, 0);
  shape.lineTo(deckWidth / 2, 0);
  shape.lineTo(deckWidth / 2, deckThickness);
  shape.lineTo(-deckWidth / 2, deckThickness);
  shape.lineTo(-deckWidth / 2, 0);
  const deckGeo = new THREE.ExtrudeGeometry(shape, { steps: 120, bevelEnabled: false, extrudePath: curve });
  const deck = new THREE.Mesh(
    deckGeo,
    new THREE.MeshStandardMaterial({ color: 0x1c1e24, roughness: 0.7, metalness: 0.2 })
  );
  deck.castShadow = true;
  deck.receiveShadow = true;
  scene.add(deck);

  // 橋脚
  const pillarCount = 9;
  for (let i = 0; i <= pillarCount; i++) {
    const t = i / pillarCount;
    const p = curve.getPointAt(t);
    if (p.y > 2) {
      const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(1.3, 1.8, p.y, 8),
        new THREE.MeshStandardMaterial({ color: 0x14161b, roughness: 0.8 })
      );
      pillar.position.set(p.x, p.y / 2, p.z);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }
  }

  // 渋滞の車列（赤＝手前レーンのテールランプ、白＝反対レーンのヘッドライト）
  function makeTrafficLane(color, laneOffset, count) {
    const bright = new THREE.Color(color).multiplyScalar(3.2);
    const cars = [];
    for (let i = 0; i < count; i++) {
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1.6, 0.8),
        new THREE.MeshBasicMaterial({ color: bright, transparent: true, opacity: 0.95, fog: true })
      );
      scene.add(mesh);
      // 渋滞なので車間は詰まっていて、ほぼ動かない（ごく低速）
      cars.push({ mesh, t: i / count, speed: 0.0025 + Math.random() * 0.002 });
    }
    return { cars, laneOffset };
  }

  const redLane = makeTrafficLane(0xff2222, -deckWidth * 0.28, 26);
  const whiteLane = makeTrafficLane(0xfff4d8, deckWidth * 0.28, 26);

  highways.push({ curve, lanes: [redLane, whiteLane] });
}

const zeppelins = [];

function makeZeppelin() {
  const group = new THREE.Group();

  const gondola = new THREE.Mesh(
    new THREE.BoxGeometry(5.5, 2.2, 3),
    new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.7, fog: false })
  );
  gondola.position.y = -6.2;
  group.add(gondola);

  // 光る広告パネル（側面2箇所＋見上げたときに見えるよう船体下面にも設置）
  const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
  const brightColor = new THREE.Color(color).multiplyScalar(4.2);
  const signMat = new THREE.MeshBasicMaterial({ color: brightColor, transparent: true, opacity: 0.95, side: THREE.DoubleSide, fog: false });
  const sideSignGeo = new THREE.PlaneGeometry(13, 4);
  for (const side of [1, -1]) {
    const sign = new THREE.Mesh(sideSignGeo, signMat);
    sign.position.set(0, 0.5, side * 5.6);
    sign.rotation.y = side > 0 ? 0 : Math.PI;
    group.add(sign);
  }
  const bottomSign = new THREE.Mesh(new THREE.PlaneGeometry(13, 4.5), signMat);
  bottomSign.position.set(0, -5.6, 0);
  bottomSign.rotation.x = Math.PI / 2;
  group.add(bottomSign);

  const noseLight = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff2222, fog: false })

  noseLight.position.set(17.3, 0, 0);
  group.add(noseLight);

  return { group, noseLight };
}

function addZeppelin(radius, height, angularOffset, driftSpeed, driftAmp) {

// 割れた月（PVでのみ登場）
function makeBrokenMoon(R) {
  const group = new THREE.Group();
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#cfcac0';
  ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 160; i++) {
    ctx.fillStyle = `rgba(90,85,80,${0.12 + Math.random() * 0.35})`;
    ctx.beginPath();
    ctx.arc(Math.random() * c.width, Math.random() * c.height, 2 + Math.random() * 16, 0, Math.PI * 2);
    ctx.fill();
  }
  const shellMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), fog: false, side: THREE.DoubleSide });
  const coreMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff5a1e).multiplyScalar(3), fog: false, side: THREE.DoubleSide });

  for (const s of [1, -1]) {
    const geo = new THREE.SphereGeometry(R, 40, 28, 0, Math.PI);
    geo.rotateY(Math.PI / 2);
    if (s < 0) geo.rotateY(Math.PI);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(R * 0.98, 48), coreMat);
    disc.rotation.y = Math.PI / 2;
    const half = new THREE.Group();
    half.add(new THREE.Mesh(geo, shellMat), disc);
    half.position.x = s * R * 0.09;
    half.rotation.z = s * 0.06;
    group.add(half);
  }
  for (let i = 0; i < 26; i++) {
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(R * (0.02 + Math.random() * 0.05), 0), shellMat);
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * R * 1.15;
    rock.position.set((Math.random() - 0.5) * R * 0.5, Math.cos(a) * r, Math.sin(a) * r);
    group.add(rock);
  }
  const halo = document.createElement('canvas');
  halo.width = halo.height = 128;
  const hctx = halo.getContext('2d');
  const hg = hctx.createRadialGradient(64, 64, 20, 64, 64, 64);
  hg.addColorStop(0, 'rgba(255,220,190,0.45)');
  hg.addColorStop(1, 'rgba(255,120,80,0)');
  hctx.fillStyle = hg;
  hctx.fillRect(0, 0, 128, 128);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(halo), blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  }));
  sprite.scale.setScalar(R * 3.6);
  group.add(sprite);
  return group;
}

// タイトル中にカメラ前を舞う火の粉（カメラの子にして常に画面内に出す）
function makeEmbers() {
  const n = 420;
  const pos = new Float32Array(n * 3);
  const spd = new Float32Array(n);
  const reset = (i, anywhere) => {
    pos[i * 3] = (Math.random() - 0.5) * 90;
    pos[i * 3 + 1] = anywhere ? (Math.random() - 0.5) * 56 : -30 - Math.random() * 6;
    pos[i * 3 + 2] = -20 - Math.random() * 60;
    spd[i] = 4 + Math.random() * 10;
  };
  for (let i = 0; i < n; i++) reset(i, true);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dot = document.createElement('canvas');
  dot.width = dot.height = 32;
  const dctx = dot.getContext('2d');
  const g = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  dctx.fillStyle = g;
  dctx.fillRect(0, 0, 32, 32);
  const mat = new THREE.PointsMaterial({
    size: 0.9, map: new THREE.CanvasTexture(dot), color: new THREE.Color(0xff7a2a).multiplyScalar(3),
    transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  camera.add(points);
  return {
    update(dt, strength) {
      mat.opacity = strength;
      if (strength <= 0) return;
      for (let i = 0; i < n; i++) {
        pos[i * 3 + 1] += spd[i] * dt;
        pos[i * 3] += Math.sin(pos[i * 3 + 1] * 0.2 + i) * dt * 2;
        if (pos[i * 3 + 1] > 30) reset(i, false);
      }
      geo.attributes.position.needsUpdate = true;
    },
  };
}

function updatePVCamera(pt) {
  const card = PV_CARDS.find((c) => pt < c.t1) || PV_CARDS[PV_CARDS.length - 1];
  const e = card.ease(clamp01((pt - card.t0) / (card.t1 - card.t0)));
  if (card.orbit) {
    const o = card.orbit;
    const r = o.r0 + (o.r1 - o.r0) * e;
    const a = o.a0 + (o.a1 - o.a0) * e;
    camera.position.set(Math.cos(a) * r, o.y0 + (o.y1 - o.y0) * e, Math.sin(a) * r);
  } else {
    camera.position.lerpVectors(card.from, card.to, e);
  }
  lookTarget.lerpVectors(card.lookFrom, card.lookTo, e);

  // 文字が叩きつけられる瞬間のカメラシェイク
  if (card.shake) {
    const amp = card.shake * 2.2 * (1 - clamp01((pt - card.t0 - (card.textDelay || 0.08)) / 0.5));
    if (amp > 0) {
      camera.position.x += (Math.random() - 0.5) * amp;
      camera.position.y += (Math.random() - 0.5) * amp;
      camera.position.z += (Math.random() - 0.5) * amp;
    }
  }
  camera.lookAt(lookTarget);
  if (card.roll) camera.rotateZ(card.roll);
  angle = Math.atan2(camera.position.z, camera.position.x);
  return card;
}

const FONT_MIN = (w) => (s) => `${w} ${s}px 'Shippori Mincho B1', serif`;
const FONT_GOTHIC = (s) => `${s}px 'Dela Gothic One', sans-serif`;
const FONT_DOT = (s) => `${s}px 'DotGothic16', monospace`;
const FONT_ORB = (w) => (s) => `${w} ${s}px 'Orbitron', sans-serif`;

const pvRnd = (i, k) => {
  const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
  return x - Math.floor(x);
};

function measureRow(ctx, row, spacing) {
  const chars = [...row];
  const widths = chars.map((ch) => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * Math.max(0, chars.length - 1);
  return { chars, widths, total };
}

// 一番長い行がmaxWidthに収まるフォントサイズ（上限maxSize）
function fitSize(ctx, rows, fontFn, maxSize, maxWidth, spacingRatio) {
  ctx.font = fontFn(100);
  let widest = 0;
  for (const r of rows) widest = Math.max(widest, measureRow(ctx, r, 100 * spacingRatio).total);
  return Math.max(8, Math.min(maxSize, (100 * maxWidth) / widest));
}

// 1文字ずつ並べて描く（drawChar(ch, x, y, 文字番号, 幅) を呼ぶ）
function eachChar(ctx, row, cx, y, spacing, startIdx, drawChar) {
  const m = measureRow(ctx, row, spacing);
  let x = cx - m.total / 2;
  m.chars.forEach((ch, i) => {
    drawChar(ch, x + m.widths[i] / 2, y, startIdx + i, m.widths[i]);
    x += m.widths[i] + spacing;
  });
  return startIdx + m.chars.length;
}

function setText(ctx, font, align = 'center') {
  ctx.font = font;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
}

// 明るい背景でも読めるよう、文字の後ろに敷く暗い帯（横長 / 縦長）
function backing(ctx, W, cy, bandH, alpha) {
  if (alpha <= 0) return;
  const g = ctx.createLinearGradient(0, cy - bandH / 2, 0, cy + bandH / 2);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, `rgba(0,0,0,${alpha})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = g;
  ctx.fillRect(0, cy - bandH / 2, W, bandH);
  ctx.restore();
}
function backingV(ctx, H, cx, bandW, alpha) {
  if (alpha <= 0) return;
  const g = ctx.createLinearGradient(cx - bandW / 2, 0, cx + bandW / 2, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, `rgba(0,0,0,${alpha})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = g;
  ctx.fillRect(cx - bandW / 2, 0, bandW, H);
  ctx.restore();
}

// 黒いふちどり＋発光つきで文字を描く
function outlined(ctx, text, x, y, size, fill, glowColor, glowBlur) {
  ctx.shadowBlur = 0;
  ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.14;
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText(text, x, y);
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = glowBlur;
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
}
