const SHADOW_OFF = 100000;

// ゆらぐ輪郭のパスを作る（下側は闇に溶けるよう長く伸ばす）
function blobPath(ctx, cx, cy, r, t, seed) {
  const n = 56;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const th = (i / n) * Math.PI * 2;
    const k = 1
      + 0.18 * Math.sin(3 * th + t * 1.1 + seed)
      + 0.1 * Math.sin(5 * th - t * 1.7 + seed * 2.3)
      + 0.06 * Math.sin(9 * th + t * 2.6 + seed * 0.7);
    const rr = r * k;
    const down = Math.sin(th) > 0 ? Math.sin(th) * r * 1.4 : 0;
    const x = cx + Math.cos(th) * rr * 0.75;
    const y = cy + Math.sin(th) * rr * 1.25 + down;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// 画面外に図形を描き、ぼかした影だけを画面内に落とす（ぼやけたシルエットにする）
function blurredBlob(ctx, cx, cy, r, t, seed, blur, alpha) {
  ctx.save();
  ctx.shadowColor = `rgba(2,0,4,${alpha})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetX = SHADOW_OFF;
  ctx.fillStyle = '#000';
  blobPath(ctx, cx - SHADOW_OFF, cy, r, t, seed);
  ctx.fill();
  ctx.restore();
}

function drawShadowFigures(ctx, W, H, lt, fo) {
  const t = Math.max(0, lt);
  const order = [...PV_SHADOW_FIGURES].sort((a, b) => a.s - b.s);
  for (const f of order) {
    const k = easeOutCubic(clamp01((lt - f.seed * 0.12) / 0.9));
    if (k <= 0) continue;
    const r = f.s * H;
    const cx = f.x * W + Math.sin(t * 0.7 + f.seed * 2.1) * r * 0.15;
    const cy = f.y * H + Math.sin(t * 0.9 + f.seed) * r * 0.05 + (1 - k) * r * 1.5;
    const a = k * fo;

    // 外側の薄いもや＋内側の濃い核を重ねて、奥行きのある不定形の影にする
    blurredBlob(ctx, cx, cy, r * 1.35, t * 0.8, f.seed + 10, r * 0.6, 0.45 * a);
    blurredBlob(ctx, cx, cy, r, t, f.seed, r * 0.28, 0.85 * a);

    // 目（ただの丸がぼんやり光る。ゆっくり漂い、ときどき瞬く）
    const blink = pvRnd(Math.floor(t * 2.2 + f.seed * 3), f.seed) < 0.1;
    if (blink) continue;
    ctx.save();
    ctx.globalAlpha = a * (0.75 + 0.25 * Math.sin(t * 3 + f.seed));
    f.eyes.forEach(([ex, ey, es], i) => {
      const x = cx + ex * r + Math.sin(t * 1.3 + f.seed + i) * r * 0.02;
      const y = cy + ey * r + Math.cos(t * 1.1 + f.seed * 2 + i) * r * 0.02;
      const er = r * 0.09 * es;
      const g = ctx.createRadialGradient(x, y, 0, x, y, er);
      g.addColorStop(0, f.eye);
      g.addColorStop(0.35, f.eye);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, er, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
}

// ===== タイポグラフィ組版 =====
// 記法: {文字|オプション} で部分ごとに書体・大きさ・色・傾きを変える。{}の外は既定の書体・等倍。行内は中心線でそろえる
//   数値: 大きさの倍率 / g: ゴシック(Dela Gothic) m: 明朝太 n: 明朝 d: ドット文字
//   r: 赤 c: 水色 y: 灰 f: 炎グラデーション / t-6: -6度傾ける / u-.1: 上へずらす（基準サイズ比）
//   w.18: 0.18秒遅れて単独で叩きつける（溜め）
// 行は文字列か { t: 文字列, align: 'l'|'r'（主役の行＝一番長い行の左端/右端にそろえる）, dx: 横ずらし, dy: 縦ずらし }
//   dx/dy は基準サイズ比。dyを負にすると上の行に重ねられる
const TYPO_FONTS = { g: FONT_GOTHIC, m: FONT_MIN(800), n: FONT_MIN(600), d: FONT_DOT };
const TYPO_COLOR = { r: '#ff3b30', c: '#8ff4ff', y: '#b4b9c4' };
const TYPO_GLOW = { r: 'rgba(255,20,10,0.95)', c: 'rgba(60,230,255,0.9)', y: 'rgba(160,170,190,0.6)', f: 'rgba(255,60,10,1)' };
const typoCache = new Map();
// 拡大しすぎると不自然なので倍率に上限を設ける
const TYPO_MAX_SCALE = 1.7;
// 書体は記法どおり。ゴシック体/ドット文字は固有名詞と引っかかる用語だけに使い、他は明朝体にする方針
const typoFont = (sp, defFont) => sp.font || defFont;

function parseTypo(str) {
  const spans = [];
  const re = /\{([^|}]+)\|([^}]*)\}|([^{]+)/g;
  let m;
  while ((m = re.exec(str))) {
    if (m[3]) {
      spans.push({ text: m[3], scale: 1 });
      continue;
    }
    const sp = { text: m[1], scale: 1 };
    for (const tok of m[2].trim().split(/\s+/)) {
      if (!tok) continue;
      if (/^[\d.]+$/.test(tok)) sp.scale = Math.min(TYPO_MAX_SCALE, parseFloat(tok));
      else if (tok[0] === 't' && tok.length > 1) sp.rot = (parseFloat(tok.slice(1)) * Math.PI) / 180;
      else if (tok[0] === 'u' && tok.length > 1) sp.dy = parseFloat(tok.slice(1));
      else if (tok[0] === 'w' && tok.length > 1) sp.wait = parseFloat(tok.slice(1));
      else if (TYPO_FONTS[tok]) sp.font = tok;
      else sp.color = tok;
    }
    spans.push(sp);
  }
  return spans;
}

// 横組み。基準サイズ100で組んでから、収まるように縮める
function layoutTypo(ctx, rows, defFont, base, maxW, maxH, key) {
  const cacheKey = `${key}|${defFont}|${Math.round(base)}|${Math.round(maxW)}|${Math.round(maxH)}`;
  if (key && typoCache.has(cacheKey)) return typoCache.get(cacheKey);
  const B = 100;
  const glyphs = [];
  const rowInfo = [];
  let cursor = 0;
  let idx = 0;
  let spanId = 0;
  // 1周目で行ごとに組み、2周目でかたまりの幅に対して左右をそろえて縦に積む
  const built = rows.map((row, ri) => {
    const r = typeof row === 'string' ? { t: row } : row;
    let x = 0;
    let maxS = 0;
    const rg = [];
    for (const sp of parseTypo(r.t)) {
      spanId++;
      const size = B * sp.scale;
      const fontFn = TYPO_FONTS[typoFont(sp, defFont)];
      ctx.font = fontFn(size);
      const pad = sp.rot ? size * 0.12 : 0;
      const spacing = size * 0.04;
      x += pad;
      const start = x;
      const sg = [];
      for (const ch of [...sp.text]) {
        const w = ctx.measureText(ch).width;
        sg.push({ ch, x, w, size, fontFn, color: sp.color, rot: sp.rot || 0, dy: (sp.dy || 0) * B, row: ri, idx: idx++,
          wait: sp.wait || 0, span: spanId });
        x += w + spacing;
      }
      x -= spacing;
      for (const g of sg) g.px = (start + x) / 2;
      x += pad + B * 0.05;
      rg.push(...sg);
      maxS = Math.max(maxS, size);
    }
    return { r, rg, maxS, width: Math.max(0, x - B * 0.05) };
  });
  const blockW = Math.max(...built.map((b) => b.width));
  built.forEach(({ r, rg, maxS, width }) => {
    // 大きさの違う文字は行の中心線にそろえる（下の線でそろえるとデコボコが強くなるため）
    const centerY = cursor + maxS / 2 + (r.dy || 0) * B;
    const baseY = centerY + maxS / 2;
    cursor = baseY + B * 0.22;
    const alignX = r.align === 'l' ? -blockW / 2 : r.align === 'r' ? blockW / 2 - width : -width / 2;
    const ox = alignX + (r.dx || 0) * B;
    for (const g of rg) {
      g.x += ox;
      g.px += ox;
      g.y = centerY + g.size / 2 + g.dy;
      g.py = g.y - g.size * 0.45;
      glyphs.push(g);
    }
    rowInfo.push({ baseY });
  });
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const g of glyphs) {
    minX = Math.min(minX, g.x);
    maxX = Math.max(maxX, g.x + g.w);
    minY = Math.min(minY, g.y - g.size);
    maxY = Math.max(maxY, g.y);
  }
  const width = maxX - minX;
  const height = maxY - minY;
  const k = Math.min(base / B, maxW / width, maxH / height);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  for (const g of glyphs) {
    g.x = (g.x - cx) * k;
    g.px = (g.px - cx) * k;
    g.y = (g.y - cy) * k;
    g.py = (g.py - cy) * k;
    g.w *= k;
    g.size *= k;
  }
  const rowsY = rowInfo.map((r) => (r.baseY - cy) * k);
  // 語（span）ごとの範囲。溜めの演出に使う
  const spans = new Map();
  for (const g of glyphs) {
    const sp = spans.get(g.span) || { x0: Infinity, x1: -Infinity, y: -Infinity, size: g.size, rot: g.rot, px: g.px, py: g.py,
      wait: g.wait, row: g.row, lastIdx: 0, color: g.color };
    sp.x0 = Math.min(sp.x0, g.x);
    sp.x1 = Math.max(sp.x1, g.x + g.w);
    sp.y = Math.max(sp.y, g.y);
    sp.lastIdx = Math.max(sp.lastIdx, g.idx);
    spans.set(g.span, sp);
  }
  const L = { glyphs, width: width * k, height: height * k, rowsY, count: glyphs.length, spans: [...spans.values()] };
  if (key) typoCache.set(cacheKey, L);
  return L;
}

// 縦組み（右から左へ列を並べる）
function layoutTypoVertical(ctx, rows, defFont, base, maxW, maxH, key) {
  const cacheKey = `V|${key}|${Math.round(base)}|${Math.round(maxW)}|${Math.round(maxH)}`;
  if (key && typoCache.has(cacheKey)) return typoCache.get(cacheKey);
  const B = 100;
  const glyphs = [];
  let colX = 0;
  let idx = 0;
  let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity;
  const rotateChars = 'ー…「」（）〜';
  rows.forEach((row, ci) => {
    const r = typeof row === 'string' ? { t: row } : row;
    const spans = parseTypo(r.t);
    const colW = Math.max(...spans.map((s) => B * s.scale));
    const cx = colX - colW / 2;
    let y = (r.dx || 0) * B;
    for (const sp of spans) {
      const size = B * sp.scale;
      const fontFn = TYPO_FONTS[typoFont(sp, defFont)];
      for (const ch of [...sp.text]) {
        let gx = cx;
        let gy = y + size / 2;
        if ('、。'.includes(ch)) { gx += size * 0.35; gy -= size * 0.35; }
        glyphs.push({ ch, x: gx, y: gy, size, fontFn, color: sp.color, rot: rotateChars.includes(ch) ? Math.PI / 2 : 0, row: ci, idx: idx++ });
        y += size * 1.04;
      }
    }
    minY = Math.min(minY, (r.dx || 0) * B);
    maxY = Math.max(maxY, y);
    minX = Math.min(minX, cx - colW / 2);
    maxX = Math.max(maxX, cx + colW / 2);
    colX -= colW * 1.3;
  });
  const k = Math.min(base / B, maxW / (maxX - minX), maxH / (maxY - minY));
  const mx = (minX + maxX) / 2;
  const my = (minY + maxY) / 2;
  for (const g of glyphs) {
    g.x = (g.x - mx) * k;
    g.y = (g.y - my) * k;
    g.size *= k;
  }
  const L = { glyphs, width: (maxX - minX) * k, height: (maxY - minY) * k, count: glyphs.length };
  if (key) typoCache.set(cacheKey, L);
  return L;
}

function typoOf(c) {
  return c.typo || c.rows;
}

function glyphFill(ctx, g, ox, oy, accent) {
  if (g.color === 'f') {
    const gr = ctx.createLinearGradient(0, oy + g.y - g.size, 0, oy + g.y);
    gr.addColorStop(0, '#fff4c0');
    gr.addColorStop(0.5, '#ff8a1a');
    gr.addColorStop(1, '#d80a0a');
    return gr;
  }
  return TYPO_COLOR[g.color] || (accent ? '#ff4a4a' : '#f4f6ff');
}

function withGlyphTransform(ctx, g, ox, oy, fn) {
  ctx.save();
  if (g.rot) {
    const px = ox + (g.px ?? g.x);
    const py = oy + (g.py ?? g.y);
    ctx.translate(px, py);
    ctx.rotate(g.rot);
    ctx.translate(-px, -py);
  }
  ctx.font = g.fontFn(g.size);
  fn();
  ctx.restore();
}

// 横組みの1文字を、黒ふち＋発光つきで描く
function drawGlyph(ctx, g, ox, oy, { accent = false, glow = 0.35 } = {}) {
  withGlyphTransform(ctx, g, ox, oy, () => {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'ideographic';
    const colored = !!g.color || accent;
    const glowColor = TYPO_GLOW[g.color] || (accent ? 'rgba(255,0,0,0.9)' : 'rgba(0,0,0,0.75)');
    outlined(ctx, g.ch, ox + g.x, oy + g.y, g.size, glyphFill(ctx, g, ox, oy, accent), glowColor, g.size * glow * (colored ? 1.4 : 0.45));
  });
}

// 溜めつきの語は、自分の時刻から語の中心を軸に大きく叩きつける。描画しない場合は false
function withWaitPop(ctx, g, ox, oy, lg, from, fn) {
  if (lg < 0) return false;
  if (!g.wait) { fn(); return true; }
  const k = easeOutCubic(clamp01(lg / 0.14));
  const s = from - (from - 1) * k;
  ctx.save();
  ctx.translate(ox + g.px, oy + g.py);
  ctx.scale(s, s);
  ctx.translate(-(ox + g.px), -(oy + g.py));
  ctx.globalAlpha *= clamp01(lg / 0.05);
  fn();
  ctx.restore();
  return true;
}

// 溜めつきの語が叩きつけられた瞬間（lt基準）の一覧
function waitHitTimes(L, rowDelay = () => 0) {
  const t = new Set();
  for (const sp of L.spans) if (sp.wait) t.add(rowDelay(sp.row) + sp.wait);
  return [...t];
}

// 縦組みの1文字（中心基準）
function drawGlyphV(ctx, g, ox, oy, scale = 1) {
  ctx.save();
  ctx.translate(ox + g.x, oy + g.y);
  if (g.rot) ctx.rotate(g.rot);
  ctx.scale(scale, scale);
  ctx.font = g.fontFn(g.size);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  outlined(ctx, g.ch, 0, 0, g.size, TYPO_COLOR[g.color] || '#ffffff', TYPO_GLOW[g.color] || 'rgba(255,255,255,0.8)', g.size * 0.3);
  ctx.restore();
}

const PV_FX = {
  // 冒頭のクレジット（二次創作であること・出典・制作者）
  credits(ctx, W, H, c, lt, dur) {
    const inK = clamp01(lt / 0.5);
    const fo = clamp01((dur - lt) / 0.5);
    ctx.fillStyle = `rgba(0,0,0,${0.86 * Math.max(fo, 0.2)})`;
    ctx.fillRect(0, 0, W, H);
    const a = inK * fo;
    const [notice, source, author] = c.rows;
    const [tag, made] = c.en;
    const base = Math.min(H * 0.036, W * 0.028);
    const lines = [
      { text: tag, font: FONT_ORB(700), size: base * 0.62, color: '#ff5a4a', gap: 2.4, spacing: 0.45 },
      { text: notice, font: FONT_MIN(800), size: base * 1.15, color: '#ffffff', gap: 1.9 },
      { text: source, font: FONT_MIN(600), size: base * 0.78, color: '#c9cfdc', gap: 3.2 },
      { text: author, font: FONT_MIN(800), size: base, color: '#ffffff', gap: 1.9 },
      { text: made, font: FONT_ORB(500), size: base * 0.7, color: '#8ff4ff', gap: 0, spacing: 0.12 },
    ];
    const total = lines.reduce((h, l) => h + l.size * l.gap, 0);
    let y = H / 2 - total / 2 + lines[0].size;
    lines.forEach((l, i) => {
      const k = easeOutCubic(clamp01((lt - i * 0.18) / 0.5)) * fo;
      if (k > 0) {
        const size = Math.min(l.size, fitSize(ctx, [l.text], l.font, l.size, W * 0.86, l.spacing || 0));
        setText(ctx, l.font(size), 'left');
        ctx.globalAlpha = k;
        ctx.fillStyle = l.color;
        const sp = size * (l.spacing || 0);
        const m = measureRow(ctx, l.text, sp);
        let x = W / 2 - m.total / 2;
        m.chars.forEach((ch, j) => { ctx.fillText(ch, x, y + (1 - k) * size * 0.4); x += m.widths[j] + sp; });
      }
      if (i === 1) {
        ctx.globalAlpha = a * 0.6;
        ctx.fillStyle = '#c8102e';
        const lw = W * 0.28 * easeOutCubic(clamp01((lt - 0.3) / 0.6));
        ctx.fillRect(W / 2 - lw / 2, y + l.size * 0.95, lw, 2);
      }
      y += l.size * l.gap;
    });
    ctx.globalAlpha = 1;
  },
  // 端末風タイプライター（複数行を順に打つ。未確定の1文字はノイズ文字）
  type(ctx, W, H, c, lt, dur, barH) {
    const size = fitSize(ctx, c.rows, FONT_DOT, H * 0.05, W * 0.78, 0.05);
    const fo = clamp01((dur - lt) / 0.25);
    const x0 = W * 0.1;
    const gap = size * 1.45;
    const n = c.rows.length;
    const lastY = H - barH - size * 1.6;
    const firstY = lastY - gap * (n - 1);
    const boxTop = firstY - size * 1.9;
    const boxH = lastY - boxTop + size * 1.1;
    const total = c.rows.reduce((s, r) => s + [...r].length, 0);
    let typed = Math.floor(clamp01(lt / (dur * 0.55)) * total);
    ctx.globalAlpha = fo * clamp01(lt / 0.1);
    ctx.fillStyle = 'rgba(0,12,20,0.72)';
    ctx.fillRect(x0 - size * 0.6, boxTop, W * 0.8 + size * 1.2, boxH);
    ctx.fillStyle = 'rgba(120,240,255,0.8)';
    ctx.fillRect(x0 - size * 0.6, boxTop, W * 0.8 + size * 1.2, 2);
    setText(ctx, FONT_ORB(500)(size * 0.42), 'left');
    ctx.fillText(c.hud || '', x0, firstY - size * 1.25);
    setText(ctx, FONT_DOT(size), 'left');
    let cursor = null;
    c.rows.forEach((row, i) => {
      const chars = [...row];
      const y = firstY + i * gap;
      const k = Math.min(typed, chars.length);
      typed -= k;
      if (k === 0 && cursor) return;
      let shown = chars.slice(0, k).join('');
      if (k < chars.length && !cursor && lt > 0) {
        shown += NOISE_GLYPHS[Math.floor(Math.random() * NOISE_GLYPHS.length)];
        cursor = { x: x0 + ctx.measureText(shown).width, y, typing: true };
      }
      if (shown) outlined(ctx, shown, x0, y, size, '#9ff8ff', 'rgba(80,240,255,0.9)', size * 0.35);
      if (!cursor && i === n - 1) cursor = { x: x0 + ctx.measureText(shown).width, y, typing: false };
    });
    if (cursor && (cursor.typing || Math.floor(lt * 4) % 2 === 0)) {
      ctx.fillStyle = '#9ff8ff';
      ctx.fillRect(cursor.x + size * 0.1, cursor.y - size * 0.45, size * 0.55, size * 0.9);
    }
  },
  // 赤い判子のように押される
  stamp(ctx, W, H, c, lt, dur) {
    const size = fitSize(ctx, c.rows, FONT_GOTHIC, H * 0.12, W * 0.7, 0);
    setText(ctx, FONT_GOTHIC(size));
    const tw = ctx.measureText(c.rows[0]).width;
    const k = easeOutCubic(clamp01(lt / 0.14));
    const s = 1.8 - 0.8 * k;
    const shake = (1 - clamp01(lt / 0.35)) * size * 0.06;
    const fo = clamp01((dur - lt) / 0.25);
    ctx.save();
    ctx.translate(W / 2 + (Math.random() - 0.5) * shake, H * 0.5 + (Math.random() - 0.5) * shake);
    ctx.rotate(-0.06);
    ctx.scale(s, s);
    ctx.globalAlpha = clamp01(lt / 0.06) * fo;
    const bw = tw + size * 0.9;
    const bh = size * 1.6;
    ctx.fillStyle = '#c8102e';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = size * 0.5;
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = size * 0.04;
    ctx.strokeRect(-bw / 2 + size * 0.14, -bh / 2 + size * 0.14, bw - size * 0.28, bh - size * 0.28);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(c.rows[0], 0, size * 0.04);
    ctx.restore();
    if (lt >= 0 && lt < 0.08) {
      ctx.fillStyle = `rgba(255,255,255,${(1 - lt / 0.08) * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  },
  // 下段に1文字ずつ浮かび上がる
  reveal(ctx, W, H, c, lt, dur, barH) {
    const L = layoutTypo(ctx, typoOf(c), 'n', H * 0.075, W * 0.86, H * 0.3, c.t0);
    const per = Math.min(dur * 0.5, L.count * 0.035 + 0.3) / L.count;
    const fo = clamp01((dur - lt) / 0.28);
    const cy = H - barH - L.height / 2 - H * 0.04;
    backing(ctx, W, cy, L.height + H * 0.1, 0.6 * clamp01(lt / 0.25) * fo);
    for (const g of L.glyphs) {
      const ap = clamp01((lt - g.idx * per) / 0.22);
      if (ap * fo <= 0) continue;
      ctx.globalAlpha = ap * fo;
      drawGlyph(ctx, g, W / 2, cy + (1 - ap) * g.size * 0.35, { glow: 0.4 * (1.5 - ap) });
    }
  },

  // 巨大な文字が叩きつけられる
  slam(ctx, W, H, c, lt, dur) {
    const L = layoutTypo(ctx, typoOf(c), 'g', H * 0.11, W * 0.88, H * 0.62, c.t0);
    const k = easeOutCubic(clamp01(lt / 0.18));
    const scale = 2.4 - 1.4 * k + Math.max(0, lt) * 0.03;
    const alpha = clamp01(lt / 0.08) * clamp01((dur - lt) / 0.25);
    const hits = [0, ...waitHitTimes(L)];
    const sinceHit = Math.min(...hits.map((h) => (lt >= h ? lt - h : Infinity)));
    const shake = (1 - clamp01(sinceHit / 0.45)) * H * 0.009;
    backing(ctx, W, H / 2, L.height + H * 0.14, 0.55 * alpha);
    ctx.save();
    ctx.translate(W / 2 + (Math.random() - 0.5) * shake, H / 2 + (Math.random() - 0.5) * shake);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    for (const g of L.glyphs) withWaitPop(ctx, g, 0, 0, lt - g.wait, 2.2, () => drawGlyph(ctx, g, 0, 0, { glow: 0.45 }));
    ctx.restore();
    if (sinceHit < 0.1) {
      ctx.fillStyle = `rgba(255,235,220,${(1 - sinceHit / 0.1) * 0.55})`;
      ctx.fillRect(0, 0, W, H);
    }
  },

  // 散らばった文字が集まってくる
  scatter(ctx, W, H, c, lt, dur) {
    const L = layoutTypo(ctx, typoOf(c), 'm', H * 0.085, W * 0.82, H * 0.4, c.t0);
    const fo = clamp01((dur - lt) / 0.25);
    backing(ctx, W, H * 0.5, L.height + H * 0.12, 0.55 * clamp01((lt - 0.2) / 0.4) * fo);
    for (const g of L.glyphs) {
      const k = easeOutCubic(clamp01((lt - g.idx * 0.03) / 0.55));
      if (k <= 0) continue;
      const tx = W / 2;
      const ty = H * 0.5;
      const sx = (pvRnd(g.idx, 1) - 0.5) * W * 0.9;
      const sy = (pvRnd(g.idx, 2) - 0.5) * H * 0.9;
      const gx = g.x + g.w / 2;
      const gy = g.y - g.size / 2;
      ctx.save();
      ctx.translate(tx + gx + sx * (1 - k), ty + gy + sy * (1 - k));
      ctx.rotate((pvRnd(g.idx, 3) - 0.5) * 3 * (1 - k));
      const s = 1 + 2 * (1 - k);
      ctx.scale(s, s);
      ctx.globalAlpha = k * fo;
      drawGlyph(ctx, g, -gx, -gy);
      ctx.restore();
    }
  },

  // RGBずれ＋横スライスのグリッチ
  glitch(ctx, W, H, c, lt, dur) {
    const L = layoutTypo(ctx, typoOf(c), c.heavy ? 'g' : 'm', H * 0.08, W * 0.86, H * 0.5, c.t0);
    let g = (1 - clamp01(lt / 0.6)) + (Math.random() < 0.05 ? 0.6 : 0);
    if (c.heavy) g = Math.max(g, 0.25);
    const alpha = clamp01(lt / 0.1) * clamp01((dur - lt) / 0.25);
    const ox = W / 2;
    const oy = H * 0.5;
    backing(ctx, W, oy, L.height + H * 0.14, 0.6 * alpha);
    const glyphs = L.glyphs.map((gl) => (Math.random() < g * 0.25
      ? { ...gl, ch: NOISE_GLYPHS[Math.floor(Math.random() * NOISE_GLYPHS.length)] } : gl));
    if (g > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha * 0.7;
      for (const [color, dir] of [['#ff1040', -1], ['#00e5ff', 1]]) {
        for (const gl of glyphs) {
          withGlyphTransform(ctx, gl, ox + dir * g * gl.size * 0.14, oy, () => {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'ideographic';
            ctx.fillStyle = color;
            ctx.fillText(gl.ch, ox + dir * g * gl.size * 0.14 + gl.x, oy + gl.y);
          });
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = alpha;
    const strips = 10;
    const top = oy - L.height / 2 - H * 0.02;
    const stripH = (L.height + H * 0.04) / strips;
    for (let s = 0; s < strips; s++) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, top + s * stripH, W, stripH + 1);
      ctx.clip();
      const dx = Math.random() < 0.5 ? (Math.random() - 0.5) * g * H * 0.06 : 0;
      for (const gl of glyphs) drawGlyph(ctx, gl, ox + dx, oy, { accent: c.heavy, glow: 0.3 });
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  },

  // フレーズが位置・サイズを変えて次々に飛び込む
  kinetic(ctx, W, H, c, lt, dur) {
    const rows = typoOf(c);
    const n = rows.length;
    const fo = clamp01((dur - lt) / 0.25);
    const layouts = [
      { x: W * 0.08, y: H * 0.33, align: 'left', font: 'm', max: H * 0.06, dir: -1 },
      { x: W * 0.5, y: H * 0.5, align: 'center', font: 'g', max: H * 0.09, dir: 0 },
      { x: W * 0.92, y: H * 0.67, align: 'right', font: 'm', max: H * 0.065, dir: 1 },
    ];
    rows.forEach((row, i) => {
      const P = layouts[n === 3 ? i : Math.min(i * 2, 2)];
      const k = easeOutCubic(clamp01((lt - i * 0.55) / 0.3));
      if (k <= 0) return;
      const L = layoutTypo(ctx, [row], P.font, P.max, W * 0.8, H * 0.22, `${c.t0}:${i}`);
      const cx = P.align === 'left' ? P.x + L.width / 2 : P.align === 'right' ? P.x - L.width / 2 : P.x;
      backing(ctx, W, P.y, L.height + H * 0.08, 0.5 * k * fo);
      ctx.save();
      ctx.translate(cx + P.dir * (1 - k) * W * 0.15, P.y);
      if (P.dir === 0) ctx.scale(1.6 - 0.6 * k, 1.6 - 0.6 * k);
      ctx.globalAlpha = k * fo;
      const rowLt = lt - i * 0.55;
      for (const g of L.glyphs) withWaitPop(ctx, g, 0, 0, rowLt - g.wait, 1.9, () => drawGlyph(ctx, g, 0, 0));
      ctx.restore();
      const hit = waitHitTimes(L).map((h) => rowLt - h).find((d) => d >= 0 && d < 0.1);
      if (hit !== undefined) {
        ctx.fillStyle = `rgba(255,235,220,${(1 - hit / 0.1) * 0.45})`;
        ctx.fillRect(0, 0, W, H);
      }
    });
  },

  // 点灯しかけのネオン管のように明滅して灯る（部分ごとに管の色を変える）
  neon(ctx, W, H, c, lt, dur) {
    const L = layoutTypo(ctx, typoOf(c), 'g', H * 0.11, W * 0.86, H * 0.45, c.t0);
    const fo = clamp01((dur - lt) / 0.3);
    const on = lt > 0 && (lt > 0.6 ? pvRnd(Math.floor(lt * 10), 9) < 0.94 : pvRnd(Math.floor(lt * 18), 3) > 0.45);
    const ox = W / 2;
    const oy = H * 0.5;
    backing(ctx, W, oy, L.height + H * 0.14, 0.6 * clamp01(lt / 0.2) * fo);
    if (lt <= 0) return;
    ctx.globalAlpha = fo;
    for (const g of L.glyphs) {
      const tube = g.color === 'c' ? '#2ef7ff' : '#ff4fd0';
      const glow = g.color === 'c' ? '#2ef7ff' : '#ff2ec4';
      // 小さい部分は遅れて灯る
      const lit = on && (g.size > L.glyphs[L.count - 1].size * 0.8 || lt > 0.35);
      withGlyphTransform(ctx, g, ox, oy, () => {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'ideographic';
        ctx.lineJoin = 'round';
        const x = ox + g.x;
        const y = oy + g.y;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = g.size * 0.2;
        ctx.strokeText(g.ch, x, y);
        if (lit) {
          ctx.shadowColor = glow;
          ctx.shadowBlur = g.size * 0.6;
          ctx.strokeStyle = tube;
          ctx.lineWidth = g.size * 0.09;
          ctx.strokeText(g.ch, x, y);
          ctx.shadowBlur = g.size * 0.2;
          ctx.strokeStyle = '#fff2fb';
          ctx.lineWidth = g.size * 0.03;
          ctx.strokeText(g.ch, x, y);
          ctx.shadowBlur = 0;
        } else {
          ctx.strokeStyle = 'rgba(110,30,90,0.7)';
          ctx.lineWidth = g.size * 0.06;
          ctx.strokeText(g.ch, x, y);
        }
      });
    }
    ctx.globalAlpha = 1;
  },

  // 縦書き（右から左へ列が並び、墨がにじむように出る）
  vertical(ctx, W, H, c, lt, dur, barH) {
    const L = layoutTypoVertical(ctx, typoOf(c), 'm', H * 0.09, W * 0.3, (H - barH * 2) * 0.86, c.t0);
    const per = (dur * 0.5) / L.count;
    const fo = clamp01((dur - lt) / 0.3);
    const ox = W * 0.72;
    const oy = H * 0.5;
    backingV(ctx, H, ox, L.width + H * 0.12, 0.6 * clamp01(lt / 0.25) * fo);
    ctx.globalAlpha = fo;
    ctx.fillStyle = '#c8102e';
    ctx.fillRect(ox + L.width / 2 + H * 0.02, oy - L.height / 2, 3, L.height * easeOutCubic(clamp01(lt / (dur * 0.5))));
    for (const g of L.glyphs) {
      const ap = clamp01((lt - g.idx * per) / 0.25);
      if (ap <= 0) continue;
      ctx.globalAlpha = ap * fo;
      drawGlyphV(ctx, g, ox, oy, 1.3 - 0.3 * ap);
    }
    ctx.globalAlpha = 1;
  },

  // 各行が左右から残像を引いてスライドイン（shadows指定で背後に不定形の影）
  split(ctx, W, H, c, lt, dur) {
    const L = layoutTypo(ctx, typoOf(c), 'm', H * 0.072, W * 0.86, H * 0.5, c.t0);
    const fo = clamp01((dur - lt) / 0.25);
    const ox = W / 2;
    const oy = H * 0.5;
    if (c.shadows) drawShadowFigures(ctx, W, H, lt, fo);
    backing(ctx, W, oy, L.height + H * 0.12, 0.55 * clamp01(lt / 0.3) * fo);
    L.rowsY.forEach((rowY, i) => {
      const k = easeOutCubic(clamp01((lt - i * 0.18) / 0.45));
      if (k <= 0) return;
      const dir = i % 2 === 0 ? -1 : 1;
      const off = dir * (1 - k) * W * 0.6;
      const rowLt = lt - i * 0.18;
      const rowGlyphs = L.glyphs.filter((g) => g.row === i);
      if (k < 1) {
        for (let j = 3; j >= 1; j--) {
          ctx.globalAlpha = 0.15 * fo;
          for (const g of rowGlyphs) {
            if (g.wait) continue;
            withGlyphTransform(ctx, g, ox + off * (1 + j * 0.18), oy, () => {
              ctx.textAlign = 'left';
              ctx.textBaseline = 'ideographic';
              ctx.fillStyle = TYPO_COLOR[g.color] || '#f4f6ff';
              ctx.fillText(g.ch, ox + off * (1 + j * 0.18) + g.x, oy + g.y);
            });
          }
        }
      }
      ctx.globalAlpha = k * fo;
      for (const g of rowGlyphs) {
        const gOff = g.wait ? 0 : off;
        withWaitPop(ctx, g, ox + gOff, oy, rowLt - g.wait, 2.0, () => drawGlyph(ctx, g, ox + gOff, oy));
      }
      ctx.fillStyle = 'rgba(224,16,42,0.75)';
      const lineW = W * 0.35 * k;
      ctx.fillRect(dir < 0 ? 0 : W - lineW, oy + rowY + H * 0.012, lineW, 2);
    });
    const hit = waitHitTimes(L, (row) => row * 0.18).map((h) => lt - h).find((d) => d >= 0 && d < 0.1);
    if (hit !== undefined) {
      ctx.fillStyle = `rgba(255,235,220,${(1 - hit / 0.1) * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalAlpha = 1;
  },

  // 奥から近づいてきて、最後にカメラを突き抜ける
  zoom(ctx, W, H, c, lt, dur) {
    const L = layoutTypo(ctx, typoOf(c), 'm', H * 0.09, W * 0.82, H * 0.4, c.t0);
    const grow = 0.55 + 0.45 * easeOutCubic(clamp01(lt / (dur * 0.45)));
    const out = easeInQuad(clamp01((lt - (dur - 0.4)) / 0.4));
    const s = grow * (1 + out * 5);
    const alpha = clamp01(lt / 0.2) * (1 - out);
    backing(ctx, W, H / 2, (L.height + H * 0.1) * s, 0.55 * alpha);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    for (const g of L.glyphs) drawGlyph(ctx, g, 0, 0, { glow: 0.3 + out });
    ctx.restore();
  },

};

function buildTitleCache(size) {
  const text = 'ニンジャスレイヤー';
  const make = (fill, glow) => {
    const c = document.createElement('canvas');
    const g = c.getContext('2d');
    const font = `${size}px 'Dela Gothic One', sans-serif`;
    g.font = font;
    c.width = Math.ceil(g.measureText(text).width + size * 1.2);
    c.height = Math.ceil(size * 1.7);
    g.font = font;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = fill(g, c);
    if (glow) {
      g.shadowColor = 'rgba(255,20,20,1)';
      g.shadowBlur = size * 0.35;
      g.fillText(text, c.width / 2, c.height / 2);
      g.shadowBlur = 0;
    }
    g.fillText(text, c.width / 2, c.height / 2);
    return c;
  };
  const main = make((g, c) => {
    const grad = g.createLinearGradient(0, c.height * 0.25, 0, c.height * 0.75);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.45, '#ffd2c2');
    grad.addColorStop(1, '#ff2a1a');
    return grad;
  }, true);
  const cyan = make(() => '#00e5ff', false);
  return { size, main, cyan };
}

function drawTitle(ctx, W, H, lt, dur) {
  const size = Math.round(Math.min(W / 10.5, H * 0.16));
  if (!pvTitleCache || pvTitleCache.size !== size) pvTitleCache = buildTitleCache(size);
  const { main, cyan } = pvTitleCache;
  const alphaIn = clamp01(lt / 0.12);
  const fadeOut = clamp01((dur - lt) / 0.7);
  const scale = 1.35 - 0.35 * easeOutCubic(clamp01(lt / 0.4));
  const cx = W / 2;
  const cy = H * 0.46;

  const vg = ctx.createRadialGradient(cx, cy, H * 0.1, cx, cy, W * 0.75);
  vg.addColorStop(0, 'rgba(120,0,0,0)');
  vg.addColorStop(1, `rgba(90,0,0,${0.55 * alphaIn * fadeOut})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  const w = main.width * scale;
  const h = main.height * scale;
  const x0 = cx - w / 2;
  const y0 = cy - h / 2;
  const glitch = lt < 0.7 || Math.random() < 0.04;
  ctx.globalAlpha = alphaIn * fadeOut;
  if (glitch) {
    ctx.globalAlpha = 0.55 * alphaIn * fadeOut;
    ctx.drawImage(cyan, x0 - size * (0.03 + Math.random() * 0.05), y0, w, h);
    ctx.globalAlpha = alphaIn * fadeOut;
    const strips = 10;
    for (let i = 0; i < strips; i++) {
      const sy = (main.height * i) / strips;
      const sh = main.height / strips;
      const dx = Math.random() < 0.4 ? (Math.random() - 0.5) * size * 0.45 : 0;
      ctx.drawImage(main, 0, sy, main.width, sh, x0 + dx, y0 + sy * scale, w, sh * scale);
    }
  } else {
    ctx.drawImage(main, x0, y0, w, h);
  }

  const st = clamp01((lt - 0.75) / 0.6);
  if (st > 0) {
    const ss = size * 0.26;
    const sub = 'Neo-Saitama in flames';
    ctx.font = `500 ${ss}px 'Orbitron', sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const sp = ss * 0.35;
    const chars = [...sub];
    const widths = chars.map((ch) => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
    const sy = cy + h * 0.42;
    ctx.globalAlpha = st * fadeOut;
    ctx.shadowColor = 'rgba(255,40,20,0.9)';
    ctx.shadowBlur = ss * 0.8;
    ctx.fillStyle = '#ffb59a';
    let x = cx - total / 2;
    chars.forEach((ch, i) => { ctx.fillText(ch, x, sy); x += widths[i] + sp; });
    ctx.shadowBlur = 0;
    const lineLen = (W * 0.18) * easeOutCubic(st);
    ctx.fillRect(cx - total / 2 - ss - lineLen, sy - 1, lineLen, 2);
    ctx.fillRect(cx + total / 2 + ss, sy - 1, lineLen, 2);
  }
  ctx.globalAlpha = 1;

  if (lt < 0.15) {
    ctx.fillStyle = `rgba(255,240,230,${(1 - lt / 0.15) * 0.9})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// 最後のカード：表紙＋タイトル＋著者情報＋「好評発売中」（最後はこのまま止まる）
const PV_CREDITS = [
  ['著', 'ブラッドレー・ボンド、フィリップ・N・モーゼズ'],
  ['翻訳', '本兌 有、杉 ライカ'],
  ['キャラクター原案', 'わらいなく'],
  ['イラスト', '余湖 裕輝'],
];

function drawEndCard(ctx, W, H, lt, barH) {
  const t = Math.max(0, lt);
  const inK = clamp01(t / 0.6);
  ctx.fillStyle = `rgba(0,0,0,${0.62 * inK})`;
  ctx.fillRect(0, 0, W, H);

  // 表紙（左から滑り込み、ゆっくり浮遊。背後に赤い光）
  const ch = (H - barH * 2) * 0.86;
  const cw = pvCover ? (ch * pvCover.width) / pvCover.height : ch * 0.7;
  const k1 = easeOutCubic(clamp01(t / 0.7));
  const ccx = W * 0.3 - (1 - k1) * W * 0.08;
  const ccy = H * 0.5 + Math.sin(t * 1.2) * H * 0.005;
  const glow = ctx.createRadialGradient(ccx, ccy, ch * 0.1, ccx, ccy, ch * 0.85);
  glow.addColorStop(0, `rgba(255,50,20,${0.42 * k1})`);
  glow.addColorStop(1, 'rgba(255,30,10,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  if (pvCover) {
    ctx.save();
    ctx.globalAlpha = k1;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = ch * 0.06;
    ctx.drawImage(pvCover, ccx - cw / 2, ccy - ch / 2, cw, ch);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(ccx - cw / 2, ccy - ch / 2, cw, ch);
    // 表紙を一度だけ光が斜めに走る
    const sk = clamp01((t - 0.8) / 0.7);
    if (sk > 0 && sk < 1) {
      ctx.beginPath();
      ctx.rect(ccx - cw / 2, ccy - ch / 2, cw, ch);
      ctx.clip();
      const sx = ccx - cw + sk * cw * 2.2;
      const g = ctx.createLinearGradient(sx - cw * 0.25, 0, sx + cw * 0.25, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.setTransform(1, 0, -0.4, 1, ccy * 0.4, 0);
      ctx.fillRect(sx - cw * 0.25, ccy - ch / 2, cw * 0.5, ch);
    }
    ctx.restore();
  }

  // 右側の文字組み
  const left = ccx + cw / 2 + W * 0.06;
  const colW = W * 0.94 - left;
  let y = barH + (H - barH * 2) * 0.12;
  const item = (delay) => easeOutCubic(clamp01((t - delay) / 0.45));

  const k2 = item(0.3);
  const hs = H * 0.022;
  setText(ctx, FONT_ORB(500)(hs), 'left');
  ctx.globalAlpha = k2;
  ctx.fillStyle = '#ff6a5a';
  let x = left + (1 - k2) * W * 0.03;
  for (const chr of 'NINJA SLAYER') { ctx.fillText(chr, x, y); x += ctx.measureText(chr).width + hs * 0.55; }
  y += hs * 2.2;

  const k3 = item(0.5);
  if (pvTitleCache) {
    const th = H * 0.13;
    const tw = Math.min(colW, (th * pvTitleCache.main.width) / pvTitleCache.main.height);
    const thh = (tw * pvTitleCache.main.height) / pvTitleCache.main.width;
    ctx.globalAlpha = k3;
    ctx.drawImage(pvTitleCache.main, left - tw * 0.04 + (1 - k3) * W * 0.03, y - thh * 0.2, tw, thh);
    y += thh * 0.72;
  }

  const k4 = item(0.8);
  const ss = H * 0.03;
  setText(ctx, FONT_ORB(500)(ss), 'left');
  ctx.globalAlpha = k4;
  ctx.shadowColor = 'rgba(255,40,20,0.9)';
  ctx.shadowBlur = ss * 0.6;
  ctx.fillStyle = '#ffb59a';
  x = left + (1 - k4) * W * 0.03;
  for (const chr of 'Neo-Saitama in flames') { ctx.fillText(chr, x, y); x += ctx.measureText(chr).width + ss * 0.3; }
  ctx.shadowBlur = 0;
  y += ss * 2.4;

  // 著者情報（ラベルは赤、名前は白）
  const cs = fitSize(ctx, PV_CREDITS.map(([l, n]) => `${l}　${n}`), FONT_MIN(600), H * 0.03, colW, 0);
  PV_CREDITS.forEach(([label, name], i) => {
    const k = item(1.05 + i * 0.15);
    ctx.globalAlpha = k;
    setText(ctx, FONT_MIN(600)(cs * 0.82), 'left');
    const lx = left + (1 - k) * W * 0.03;
    ctx.fillStyle = '#ff5a4a';
    ctx.fillText(label, lx, y);
    const lw = ctx.measureText(`${label}　`).width;
    setText(ctx, FONT_MIN(600)(cs), 'left');
    ctx.fillStyle = '#eef1f8';
    ctx.fillText(name, lx + lw, y);
    y += cs * 1.75;
  });

  // 好評発売中（溜め→叩きつけ→脈打つ光）
  const BADGE_AT = 3.0;
  const bs = fitSize(ctx, ['好評発売中'], FONT_GOTHIC, H * 0.1, colW, 0);
  const by = Math.max(y + bs * 0.9, H - barH - (H - barH * 2) * 0.16);
  const charge = clamp01((t - (BADGE_AT - 0.75)) / 0.75);
  if (charge > 0 && t < BADGE_AT) {
    // 画面がじわっと暗くなり、叩きつける位置に赤い光が細く溜まっていく
    const ck = easeInQuad(charge);
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(0,0,0,${0.35 * ck})`;
    ctx.fillRect(0, 0, W, H);
    const lw = colW * 0.9 * ck;
    ctx.save();
    ctx.shadowColor = 'rgba(255,40,10,1)';
    ctx.shadowBlur = bs * (0.3 + 0.9 * ck);
    ctx.fillStyle = `rgba(255,${Math.round(120 + 120 * ck)},${Math.round(80 + 150 * ck)},${0.5 + 0.5 * ck})`;
    const cx = left + colW * 0.45;
    ctx.fillRect(cx - lw / 2, by - bs * 0.03 * (1 + ck), lw, bs * 0.06 * (1 + ck));
    ctx.restore();
  }
  const bt = t - BADGE_AT;
  if (bt > 0) {
    const bk = easeOutCubic(clamp01(bt / 0.2));
    const scale = 1.7 - 0.7 * bk;
    ctx.save();
    ctx.translate(left, by);
    ctx.scale(scale, scale);
    setText(ctx, FONT_GOTHIC(bs), 'left');
    ctx.globalAlpha = clamp01(bt / 0.08);
    const g = ctx.createLinearGradient(0, -bs / 2, 0, bs / 2);
    g.addColorStop(0, '#fff4c0');
    g.addColorStop(0.5, '#ff8a1a');
    g.addColorStop(1, '#e00a0a');
    outlined(ctx, '好評発売中', 0, 0, bs, g, 'rgba(255,30,10,1)', bs * (0.35 + 0.15 * Math.sin(t * 4)));
    ctx.fillStyle = '#e00a0a';
    ctx.fillRect(0, bs * 0.72, ctx.measureText('好評発売中').width * bk, bs * 0.06);
    ctx.restore();
    if (bt < 0.12) {
      ctx.fillStyle = `rgba(255,235,220,${(1 - bt / 0.12) * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
  ctx.globalAlpha = 1;
}

function drawPVOverlay(pt, card) {
  const ctx = pvCtx;
  const W = pvOverlay.width;
  const H = pvOverlay.height;
  ctx.clearRect(0, 0, W, H);
  if (pvStart === null) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  const barFull = Math.max(H * 0.1, (H - W / 2.39) / 2);
  const barH = barFull * easeOutCubic(clamp01(pt / 0.5));
  const cardLt = pt - card.t0;

  // 赤い色かぶり（炎・ナラクの場面）
  if (card.tint) {
    const k = card.tint * clamp01(cardLt / 0.2) * clamp01((card.t1 - pt) / 0.3);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.15, W / 2, H / 2, W * 0.75);
    vg.addColorStop(0, `rgba(140,10,0,${k * 0.5})`);
    vg.addColorStop(1, `rgba(90,0,0,${k * 2})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  const delay = card.textDelay ?? 0.08;
  if (card.endcard) {
    drawEndCard(ctx, W, H, cardLt, barFull);
  } else if (card.title) {
    drawTitle(ctx, W, H, cardLt, card.dur);
  } else {
    ctx.save();
    PV_FX[card.fx](ctx, W, H, card, cardLt - delay, card.dur - delay, barFull);
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  // カット切り替え（black: 一瞬の黒コマ / flash: 強い白フラッシュ / 既定: 弱いフラッシュ＋グリッチノイズ）
  const cut = card.cut || 'glitch';
  if (cut === 'black' && cardLt < 0.07) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  if (card.t0 > 0 && (cut === 'flash' || cut === 'glitch') && cardLt < 0.16) {
    const f = 1 - cardLt / 0.16;
    ctx.fillStyle = `rgba(255,255,255,${f * (cut === 'flash' ? 0.8 : 0.25)})`;
    ctx.fillRect(0, 0, W, H);
    if (cut === 'glitch') {
      for (let i = 0; i < 7; i++) {
        ctx.fillStyle = Math.random() < 0.5 ? `rgba(0,229,255,${f * 0.5})` : `rgba(255,40,90,${f * 0.5})`;
        ctx.fillRect(Math.random() * W * 0.3, Math.random() * H, W * (0.3 + Math.random() * 0.7), 2 + Math.random() * H * 0.02);
      }
    }
  }

  // 走査線（うっすら）
  if (!pvScanPattern) {
    const p = document.createElement('canvas');
    p.width = 1; p.height = 4;
    const pc = p.getContext('2d');
    pc.fillStyle = 'rgba(0,0,0,1)';
    pc.fillRect(0, 0, 1, 1);
    pvScanPattern = ctx.createPattern(p, 'repeat');
  }
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = pvScanPattern;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // シネスコの黒帯
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, barH);
  ctx.fillRect(0, H - barH, W, barH);

  // 冒頭のフェードイン
  const black = 1 - pt / 0.5;
  if (black > 0) {
    ctx.fillStyle = `rgba(0,0,0,${black})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function startPVRecording(ui) {
  const w = 1920;
  const h = Math.round((1920 * window.innerHeight) / window.innerWidth / 2) * 2;
  pvRecCanvas = document.createElement('canvas');
  pvRecCanvas.width = w;
  pvRecCanvas.height = h;
  pvRecCtx = pvRecCanvas.getContext('2d');
  initAudio();
  audioCtx.resume();
  const types = [
    'video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4',
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm',
  ];
  const mimeType = types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  const stream = new MediaStream([
    ...pvRecCanvas.captureStream(60).getVideoTracks(),
    ...audioDest.stream.getAudioTracks(),
  ]);
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 20_000_000, audioBitsPerSecond: 256_000 });
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || 'video/webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `neo-saitama-pv.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    a.click();
    pvRecorder = null;
    ui.style.display = '';
  };
  ui.style.display = 'none';
  restartPV();
  recorder.start();
  pvRecorder = recorder;
}

// ===== PVの音楽（Web Audioでその場で合成する、サイバーパンク×和風） =====
// 和風は都節音階（D・E♭・G・A・B♭）の琴/三味線/尺八/太鼓、サイバーパンクは172BPMのドラムンベース（2ステップ＋リースベース）
let audioCtx = null;
let audioComp = null;
let audioDest = null;
let audioReverb = null;
let noiseBuf = null;
let music = null;
const ksCache = new Map();

const NOTE = {
  A1: 55.0, Bb1: 58.27, C2: 65.41, D2: 73.42, Eb2: 77.78, G2: 98.0, A2: 110.0,
  D3: 146.83, Eb3: 155.56, F3: 174.61, G3: 196.0, A3: 220.0, Bb3: 233.08,
  D4: 293.66, Eb4: 311.13, G4: 392.0, A4: 440.0, Bb4: 466.16, D5: 587.33, Eb5: 622.25,
};

function initAudio(offlineCtx = null) {
  if (audioCtx && !offlineCtx) return;
  audioCtx = offlineCtx || new (window.AudioContext || window.webkitAudioContext)();
  const sr = audioCtx.sampleRate;
  audioComp = audioCtx.createDynamicsCompressor();
  audioComp.threshold.value = -14;
  audioComp.knee.value = 10;
  audioComp.ratio.value = 4;
  audioComp.attack.value = 0.003;
  audioComp.release.value = 0.25;
  const master = audioCtx.createGain();
  master.gain.value = 0.9;
  audioComp.connect(master);
  master.connect(audioCtx.destination);
  if (!offlineCtx) {
    audioDest = audioCtx.createMediaStreamDestination();
    master.connect(audioDest);
  }

  noiseBuf = audioCtx.createBuffer(1, sr * 2, sr);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // 残響（指数的に減衰するノイズをインパルス応答にする）
  const len = Math.floor(sr * 2.8);
  const ir = audioCtx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  audioReverb = audioCtx.createConvolver();
  audioReverb.buffer = ir;
  const ret = audioCtx.createGain();
  ret.gain.value = 0.35;
  audioReverb.connect(ret);
  ret.connect(audioComp);
}

// ---- 音色の部品 ----
function envGain(m, T, peak, attack, decay, send = 0) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, T);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), T + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, T + attack + decay);
  g.connect(m.bus);
  if (send) {
    const s = audioCtx.createGain();
    s.gain.value = send;
    g.connect(s);
    s.connect(m.send);
  }
  return g;
}
function osc(type, T, dur, freq) {
  const o = audioCtx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, T);
  o.start(T);
  o.stop(T + dur + 0.05);
  return o;
}
function noise(T, dur) {
  const s = audioCtx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  s.start(T, Math.random() * 1.5);
  s.stop(T + dur + 0.05);
  return s;
}
function filt(type, freq, q = 1) {
  const f = audioCtx.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q;
  return f;
}

function kick(m, T, amp = 0.9) {
  const o = osc('sine', T, 0.5, 160);
  o.frequency.exponentialRampToValueAtTime(42, T + 0.13);
  o.connect(envGain(m, T, amp, 0.002, 0.42));
  const n = noise(T, 0.03);
  const f = filt('highpass', 3000);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.15, 0.001, 0.012));
}
function taiko(m, T, amp = 0.8) {
  const o = osc('sine', T, 1.1, 110);
  o.frequency.exponentialRampToValueAtTime(58, T + 0.18);
  o.connect(envGain(m, T, amp, 0.003, 0.9, 0.25));
  const o2 = osc('triangle', T, 0.3, 190);
  o2.frequency.exponentialRampToValueAtTime(120, T + 0.1);
  o2.connect(envGain(m, T, amp * 0.3, 0.002, 0.2));
  const n = noise(T, 0.3);
  const f = filt('lowpass', 600);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.45, 0.002, 0.25, 0.2));
}
function ka(m, T, amp = 0.3) {
  const n = noise(T, 0.08);
  const f = filt('bandpass', 2500, 3);
  n.connect(f);
  f.connect(envGain(m, T, amp, 0.001, 0.05, 0.2));
  osc('sine', T, 0.06, 900).connect(envGain(m, T, amp * 0.5, 0.001, 0.04));
}
function snare(m, T, amp = 0.5) {
  const n = noise(T, 0.25);
  const f = filt('highpass', 1200);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.7, 0.001, 0.2, 0.15));
  const o = osc('triangle', T, 0.15, 200);
  o.frequency.exponentialRampToValueAtTime(160, T + 0.08);
  o.connect(envGain(m, T, amp * 0.4, 0.001, 0.1));
}
function hat(m, T, amp = 0.14, open = false) {
  const n = noise(T, open ? 0.3 : 0.06);
  const f = filt('highpass', 7000);
  n.connect(f);
  f.connect(envGain(m, T, amp, 0.001, open ? 0.25 : 0.045));
}
function bass(m, T, freq, dur, amp = 0.3) {
  const f = filt('lowpass', 200, 6);
  f.frequency.setValueAtTime(180, T);
  f.frequency.exponentialRampToValueAtTime(1400, T + 0.02);
  f.frequency.exponentialRampToValueAtTime(220, T + dur * 0.9);
  const g = envGain(m, T, amp, 0.005, dur);
  f.connect(g);
  for (const det of [-7, 7]) {
    const o = osc('sawtooth', T, dur, freq);
    o.detune.value = det;
    o.connect(f);
  }
  osc('sine', T, dur, freq / 2).connect(envGain(m, T, amp * 0.8, 0.005, dur));
}
// カープラス・ストロング法ではじいた弦（琴・三味線）の音を作る
function ksBuffer(freq) {
  const key = Math.round(freq * 10);
  if (ksCache.has(key)) return ksCache.get(key);
  const sr = audioCtx.sampleRate;
  const len = Math.floor(sr * 1.8);
  const buf = audioCtx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  const N = Math.max(2, Math.round(sr / freq));
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let idx = 0;
  for (let i = 0; i < len; i++) {
    const a = ring[idx];
    ring[idx] = (a + ring[(idx + 1) % N]) * 0.5 * 0.996;
    d[i] = a;
    idx = (idx + 1) % N;
  }
  ksCache.set(key, buf);
  return buf;
}
function pluck(m, T, freq, amp = 0.25, bend = 0, cutoff = 5000) {
  const s = audioCtx.createBufferSource();
  s.buffer = ksBuffer(freq);
  if (bend) {
    // 三味線のすくい上げるような音程の揺れ
    s.playbackRate.setValueAtTime(Math.pow(2, -bend / 12), T);
    s.playbackRate.exponentialRampToValueAtTime(1, T + 0.08);
  }
  const f = filt('lowpass', cutoff);
  s.connect(f);
  f.connect(envGain(m, T, amp, 0.001, 1.6, 0.25));
  s.start(T);
  s.stop(T + 1.8);
}
function flute(m, T, freq, dur, amp = 0.12) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, T);
  g.gain.linearRampToValueAtTime(amp, T + 0.25);
  g.gain.setValueAtTime(amp, T + Math.max(0.3, dur - 0.4));
  g.gain.linearRampToValueAtTime(0.0001, T + dur);
  g.connect(m.bus);
  const s = audioCtx.createGain();
  s.gain.value = 0.55;
  g.connect(s);
  s.connect(m.send);
  const o = osc('sine', T, dur, freq * 0.94);
  o.frequency.exponentialRampToValueAtTime(freq, T + 0.15);
  const lfo = osc('sine', T, dur, 5.5);
  const depth = audioCtx.createGain();
  depth.gain.setValueAtTime(0, T);
  depth.gain.linearRampToValueAtTime(freq * 0.012, T + 0.6);
  lfo.connect(depth);
  depth.connect(o.frequency);
  o.connect(g);
  const n = noise(T, dur);
  const bf = filt('bandpass', freq * 2, 2);
  const ng = audioCtx.createGain();
  ng.gain.value = 0.35;
  n.connect(bf);
  bf.connect(ng);
  ng.connect(g);
}
function pad(m, T, freqs, dur, amp = 0.06, cutoff = 900) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, T);
  g.gain.linearRampToValueAtTime(amp, T + Math.min(0.8, dur * 0.3));
  g.gain.setValueAtTime(amp, T + Math.max(0.9, dur - 1.2));
  g.gain.linearRampToValueAtTime(0.0001, T + dur);
  const f = filt('lowpass', cutoff, 0.7);
  f.connect(g);
  g.connect(m.bus);
  const s = audioCtx.createGain();
  s.gain.value = 0.45;
  g.connect(s);
  s.connect(m.send);
  for (const fr of freqs) {
    for (const det of [-10, 10]) {
      const o = osc('sawtooth', T, dur, fr);
      o.detune.value = det;
      o.connect(f);
    }
  }
}
function impact(m, T, amp = 1) {
  const o = osc('sine', T, 1.6, 70);
  o.frequency.exponentialRampToValueAtTime(28, T + 1.4);
  o.connect(envGain(m, T, amp, 0.003, 1.5));
  const n = noise(T, 1.2);
  const f = filt('lowpass', 8000);
  f.frequency.setValueAtTime(8000, T);
  f.frequency.exponentialRampToValueAtTime(200, T + 0.8);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.55, 0.002, 1.0, 0.5));
  taiko(m, T, amp * 0.9);
}
function gong(m, T, amp = 0.6) {
  [1, 2.76, 5.4, 8.93].forEach((r, i) => {
    const o = osc('sine', T, 4.2, 82 * r);
    o.frequency.exponentialRampToValueAtTime(82 * r * 0.985, T + 4);
    o.connect(envGain(m, T, amp * [0.5, 0.3, 0.18, 0.1][i], 0.004, 3.6 - i * 0.5, 0.6));
  });
  const n = noise(T, 2.6);
  const f = filt('highpass', 3000);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.18, 0.002, 2.4, 0.6));
}
function riser(m, T, dur, amp = 0.35) {
  const n = noise(T, dur);
  const f = filt('bandpass', 300, 4);
  f.frequency.setValueAtTime(300, T);
  f.frequency.exponentialRampToValueAtTime(6000, T + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, T);
  g.gain.exponentialRampToValueAtTime(amp, T + dur);
  g.gain.setValueAtTime(0.0001, T + dur + 0.01);
  n.connect(f);
  f.connect(g);
  g.connect(m.bus);
  const s = audioCtx.createGain();
  s.gain.value = 0.4;
  g.connect(s);
  s.connect(m.send);
  const o = osc('sawtooth', T, dur, 110);
  o.frequency.exponentialRampToValueAtTime(880, T + dur);
  const of = filt('lowpass', 2000);
  const og = audioCtx.createGain();
  og.gain.value = 0.35;
  o.connect(of);
  of.connect(og);
  og.connect(g);
}

// ---- バトル向けの激しい音色 ----
const distCurves = new Map();
function distCurve(k) {
  if (distCurves.has(k)) return distCurves.get(k);
  const n = 2048;
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    c[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
  }
  distCurves.set(k, c);
  return c;
}
function shaper(k) {
  const w = audioCtx.createWaveShaper();
  w.curve = distCurve(k);
  w.oversample = '2x';
  return w;
}

function kickHard(m, T, amp = 1) {
  const o = osc('sine', T, 0.45, 190);
  o.frequency.exponentialRampToValueAtTime(45, T + 0.09);
  const d = shaper(6);
  o.connect(d);
  d.connect(envGain(m, T, amp * 0.9, 0.001, 0.32));
  const n = noise(T, 0.02);
  const f = filt('highpass', 2500);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.3, 0.001, 0.01));
}
function snareHard(m, T, amp = 0.65) {
  const n = noise(T, 0.3);
  const f = filt('highpass', 900);
  const d = shaper(3);
  n.connect(f);
  f.connect(d);
  d.connect(envGain(m, T, amp * 0.6, 0.001, 0.17, 0.2));
  const o = osc('triangle', T, 0.12, 230);
  o.frequency.exponentialRampToValueAtTime(170, T + 0.06);
  o.connect(envGain(m, T, amp * 0.5, 0.001, 0.08));
}
function crash(m, T, amp = 0.35) {
  const n = noise(T, 1.6);
  const f = filt('highpass', 5000);
  n.connect(f);
  f.connect(envGain(m, T, amp, 0.002, 1.4, 0.35));
  const n2 = noise(T, 0.8);
  const f2 = filt('bandpass', 9000, 0.8);
  n2.connect(f2);
  f2.connect(envGain(m, T, amp * 0.5, 0.001, 0.6));
}
// 太鼓の高い/低い胴（フィル用）
function tom(m, T, freq, amp = 0.6) {
  const o = osc('sine', T, 0.4, freq * 1.6);
  o.frequency.exponentialRampToValueAtTime(freq, T + 0.05);
  o.connect(envGain(m, T, amp, 0.002, 0.3, 0.2));
  const n = noise(T, 0.1);
  const f = filt('lowpass', 1200);
  n.connect(f);
  f.connect(envGain(m, T, amp * 0.3, 0.001, 0.06));
}
// 歪んだノコギリ波のベース
function bassHard(m, T, freq, dur, amp = 0.32) {
  const d = shaper(8);
  const f = filt('lowpass', 300, 5);
  f.frequency.setValueAtTime(300, T);
  f.frequency.exponentialRampToValueAtTime(2600, T + 0.015);
  f.frequency.exponentialRampToValueAtTime(380, T + dur * 0.85);
  d.connect(f);
  f.connect(envGain(m, T, amp, 0.003, dur));
  for (const [type, det] of [['sawtooth', -9], ['sawtooth', 9], ['square', 0]]) {
    const o = osc(type, T, dur, freq);
    o.detune.value = det;
    o.connect(d);
  }
  osc('sine', T, dur, freq / 2).connect(envGain(m, T, amp * 0.9, 0.003, dur));
}
// ドラムンベースのリースベース（うねるように伸ばす低音）
function reese(m, T, freq, dur, amp = 0.3) {
  const d = shaper(3);
  const f = filt('lowpass', 500, 4);
  const lfo = osc('sine', T, dur, 1.5 + Math.random());
  const depth = audioCtx.createGain();
  depth.gain.value = 320;
  lfo.connect(depth);
  depth.connect(f.frequency);
  d.connect(f);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, T);
  g.gain.linearRampToValueAtTime(amp, T + 0.02);
  g.gain.setValueAtTime(amp, T + Math.max(0.03, dur - 0.08));
  g.gain.linearRampToValueAtTime(0.0001, T + dur);
  f.connect(g);
  g.connect(m.bus);
  for (const det of [-18, 18]) {
    const o = osc('sawtooth', T, dur, freq);
    o.detune.value = det;
    o.connect(d);
  }
  const sub = osc('sine', T, dur, freq / 2);
  const sg = audioCtx.createGain();
  sg.gain.setValueAtTime(0.0001, T);
  sg.gain.linearRampToValueAtTime(amp * 1.1, T + 0.02);
  sg.gain.setValueAtTime(amp * 1.1, T + Math.max(0.03, dur - 0.08));
  sg.gain.linearRampToValueAtTime(0.0001, T + dur);
  sub.connect(sg);
  sg.connect(m.bus);
}
// 琴のアクセントを低い音で追いかけて支える
function lowEcho(m, T, freq, amp = 0.22) {
  const o = osc('triangle', T, 0.35, freq);
  const f = filt('lowpass', 700);
  o.connect(f);
  f.connect(envGain(m, T, amp, 0.004, 0.3));
}
// ギターのパワーコード風の歪んだ和音（ルート・5度・オクターブ）
function stab(m, T, root, dur, amp = 0.16) {
  const d = shaper(20);
  const f = filt('lowpass', 3200, 1);
  d.connect(f);
  f.connect(envGain(m, T, amp, 0.004, dur, 0.2));
  for (const r of [1, 1.5, 2]) {
    for (const det of [-12, 12]) {
      const o = osc('sawtooth', T, dur, root * r);
      o.detune.value = det;
      o.connect(d);
    }
  }
}
// 歪ませたエレキ三味線
function eShamisen(m, T, freq, amp = 0.2, bend = 0) {
  const s = audioCtx.createBufferSource();
  s.buffer = ksBuffer(freq);
  if (bend) {
    s.playbackRate.setValueAtTime(Math.pow(2, -bend / 12), T);
    s.playbackRate.exponentialRampToValueAtTime(1, T + 0.06);
  }
  const pre = audioCtx.createGain();
  pre.gain.value = 3;
  const d = shaper(12);
  const f = filt('lowpass', 4200, 1);
  s.connect(pre);
  pre.connect(d);
  d.connect(f);
  f.connect(envGain(m, T, amp, 0.001, 0.9, 0.3));
  s.start(T);
  s.stop(T + 1.2);
}

// ---- 台本のカード時刻から曲を組み立てる ----
function buildMusicEvents() {
  const ev = [];
  const at = (t, fn) => ev.push({ t, fn });
  const C = PV_CARDS;
  const textAt = (c) => c.t0 + (c.textDelay ?? 0.08);
  const typeC = C.find((c) => c.fx === 'type');
  const shadowC = C.find((c) => c.shadows);
  const heroC = C[C.indexOf(shadowC) + 1];
  const titleC = C.find((c) => c.title);
  const endC = C.find((c) => c.endcard);
  const zoomC = C.find((c) => c.fx === 'zoom');
  const heavyC = C.find((c) => c.heavy);
  const lastSlam = C[C.indexOf(titleC) - 1];
  const openC = C.find((c) => c.fire);
  const openNext = C[C.indexOf(openC) + 1];
  const BPM = 172;
  const BEAT = 60 / BPM;
  const BAR = BEAT * 4;
  const S16 = BEAT / 4;
  const roots = [NOTE.D2, NOTE.D2, NOTE.Bb1, NOTE.G2, NOTE.D2, NOTE.D2, NOTE.Eb2, NOTE.A1];
  const arp = [NOTE.D4, NOTE.A4, NOTE.Bb4, NOTE.A4, NOTE.D5, NOTE.A4, NOTE.G4, NOTE.Eb4];
  // エレキ三味線のリフ（16分の位置, 音, すくい上げ量）
  const riff = [[0, NOTE.D4, 2], [3, NOTE.D4, 0], [6, NOTE.Eb4, 1], [8, NOTE.D4, 0], [10, NOTE.A3, 2], [12, NOTE.Bb3, 0], [14, NOTE.A3, 1]];

  // ブレイクビーツ風のドラム1小節（ドコスカ）。fill=true で最後の1拍を太鼓の連打にする
  const drumBar = (bt, { fill = false, crashOn = false, taikoAmp = 0.7, heavy = false } = {}) => {
    const kicks = heavy ? [0, 7, 10, 13] : [0, 10];
    for (const s of kicks) if (!(fill && s >= 12)) at(bt + s * S16, (m, T) => kickHard(m, T, 1));
    for (const s of [4, 12]) if (!(fill && s >= 12)) at(bt + s * S16, (m, T) => snareHard(m, T, 0.7));
    for (const s of [7, 9, 14]) if (!(fill && s >= 12)) at(bt + s * S16, (m, T) => snareHard(m, T, 0.14));
    for (let s = 0; s < 16; s++) {
      if (fill && s >= 12) break;
      at(bt + s * S16, (m, T) => hat(m, T, s % 2 === 0 ? 0.13 : 0.06, s === 6 || s === 14));
    }
    for (const s of [0, 8]) at(bt + s * S16, (m, T) => taiko(m, T, taikoAmp));
    for (const s of [3, 11]) at(bt + s * S16, (m, T) => ka(m, T, 0.22));
    if (crashOn) at(bt, (m, T) => crash(m, T, 0.35));
    if (fill) {
      const toms = [260, 220, 180, 150, 120, 100, 85, 70];
      toms.forEach((fr, i) => at(bt + BEAT * 3 + i * (S16 / 2), (m, T) => tom(m, T, fr, 0.55 + i * 0.03)));
      at(bt + BEAT * 3, (m, T) => snareHard(m, T, 0.5));
    }
  };

  // 文字が出るたびに鳴らすとうるさいので、衝撃音は曲の始まりとタイトル直前の2か所だけにする
  for (const c of [C.find((x) => x.fire), lastSlam]) {
    at(textAt(c), (m, T) => impact(m, T, c === lastSlam ? 1.15 : 1.0));
    at(textAt(c), (m, T) => stab(m, T, NOTE.D2 * 2, 0.5, 0.2));
  }

  // --- 冒頭：衝撃→三味線→太鼓の乱れ打ち ---
  at(0, (m, T) => pad(m, T, [NOTE.D2, NOTE.A2], typeC.t0 + 0.4, 0.07, 500));
  at(textAt(openC), (m, T) => gong(m, T, 0.5));
  [[0.3, NOTE.D4, 2], [0.42, NOTE.Eb4, 0], [0.54, NOTE.D4, 0], [0.78, NOTE.A3, 1], [1.1, NOTE.D4, 2]].forEach(([dt, f, b]) =>
    at(textAt(openC) + dt, (m, T) => eShamisen(m, T, f, 0.22, b)));
  openNext.rows.forEach((_, i) => {
    const t = textAt(openNext) + i * 0.55;
    at(t, (m, T) => taiko(m, T, 0.85 + i * 0.1));
    at(t, (m, T) => stab(m, T, NOTE.D2 * 2, 0.25, 0.14));
    for (let j = 1; j < 4; j++) at(t + j * S16, (m, T) => tom(m, T, 150 - j * 15, 0.4));
  });
  // ビートの入り直前に太鼓を連打して煽る
  for (let i = 0; i < 12; i++) at(typeC.t0 - 12 * (S16 / 2) + i * (S16 / 2), (m, T) => tom(m, T, 120 + i * 12, 0.3 + i * 0.03));
  at(typeC.t0 - 1.0, (m, T) => riser(m, T, 1.0, 0.35));

  // --- 前半のビート（世界観パート） ---
  const g1 = typeC.t0;
  const g1Bars = Math.floor((shadowC.t0 - g1) / BAR);
  for (let b = 0; b < g1Bars; b++) {
    const bt = g1 + b * BAR;
    const root = roots[b % roots.length];
    drumBar(bt, { fill: b % 4 === 3, crashOn: b % 4 === 0 });
    at(bt, (m, T) => reese(m, T, root, BAR * 0.5, 0.3));
    at(bt + BAR * 0.5, (m, T) => reese(m, T, b % 2 ? root * 1.5 : root, BAR * 0.5, 0.3));
    if (b % 2 === 1) for (const s of [0, 3, 6]) at(bt + s * S16, (m, T) => stab(m, T, root * 2, S16 * 2.5, 0.12));
    if (b >= 2) {
      for (let s = 0; s < 16; s++) {
        const note = arp[(s + b * 3) % arp.length] / 2;
        at(bt + s * S16, (m, T) => pluck(m, T, note, s % 4 === 0 ? 0.15 : 0.08, 0, 2600));
        if (s % 4 === 0) at(bt + s * S16, (m, T) => lowEcho(m, T, note / 2));
      }
    }
    if (b >= 6) for (const [s, f, bend] of riff) at(bt + s * S16, (m, T) => eShamisen(m, T, f, 0.17, bend));
  }
  // 残り（小節に満たない部分）は太鼓の連打で闇パートへつなぐ
  for (let t = g1 + g1Bars * BAR; t < shadowC.t0 - 0.05; t += S16) at(t, (m, T) => tom(m, T, 140, 0.45));
  // 尺八のメロディ（中盤に乗せる）
  const melStart = g1 + BAR * 4;
  [[0, NOTE.A4, 1.0], [1.0, NOTE.Bb4, 0.5], [1.5, NOTE.A4, 0.5], [2.0, NOTE.G4, 1.0], [3.0, NOTE.D4, 1.5],
    [5.0, NOTE.Eb5, 0.8], [5.8, NOTE.D5, 1.2], [7.0, NOTE.A4, 0.9], [8.0, NOTE.Bb4, 0.6], [8.6, NOTE.A4, 1.6]].forEach(([dt, f, d]) =>
    at(melStart + dt, (m, T) => flute(m, T, f, d, 0.1)));

  // --- 闇のパート：ビートを止め、不穏なうなりと遠い太鼓（ここは静かなまま） ---
  at(shadowC.t0, (m, T) => impact(m, T, 0.6));
  at(shadowC.t0, (m, T) => pad(m, T, [NOTE.D2, NOTE.Eb2, NOTE.A2], shadowC.dur + 0.4, 0.08, 400));
  at(shadowC.t0 + 0.4, (m, T) => flute(m, T, NOTE.Eb4, 2.2, 0.08));
  at(shadowC.t0 + 0.8, (m, T) => taiko(m, T, 0.45));
  at(shadowC.t0 + 2.0, (m, T) => taiko(m, T, 0.5));
  at(heroC.t0 - 0.8, (m, T) => riser(m, T, 0.8, 0.35));
  for (let i = 0; i < 8; i++) at(heroC.t0 - 8 * (S16 / 2) + i * (S16 / 2), (m, T) => tom(m, T, 100 + i * 15, 0.35 + i * 0.04));

  // --- 後半のビート（主人公パート、さらに重く・速く） ---
  const g2 = heroC.t0;
  const g2End = lastSlam.t0;
  for (let b = 0; g2 + b * BAR < g2End - 0.01; b++) {
    const bt = g2 + b * BAR;
    const root = roots[b % roots.length];
    const quiet = bt + BAR > zoomC.t0 && bt < heavyC.t0;
    if (!quiet) {
      drumBar(bt, { fill: b % 2 === 1, crashOn: b % 2 === 0, heavy: true, taikoAmp: 0.8 });
      for (const s of [0, 3, 6, 10]) at(bt + s * S16, (m, T) => stab(m, T, root * 2, S16 * 2.2, 0.15));
      for (const [s, f, bend] of riff) at(bt + s * S16, (m, T) => eShamisen(m, T, f * (b % 2 ? 2 : 1), 0.19, bend));
    }
    for (let s = 0; s < 16; s++) {
      const t = bt + s * S16;
      if (t >= g2End) break;
      if (quiet && (t < zoomC.t0 || t >= heavyC.t0)) {
        if (s % 8 === 0) at(t, (m, T) => reese(m, T, root, S16 * 8, 0.22));
      } else if (!quiet) {
        if (s % 8 === 0) at(t, (m, T) => reese(m, T, root, S16 * 8, 0.3));
        if (s % 2 === 0) at(t, (m, T) => bassHard(m, T, root * (s % 8 === 6 ? 2 : 1), S16 * 0.9, 0.14));
      }
      // ノイズの場面では細かい連打（スタッター）を足す
      if (t >= heavyC.t0 && t < heavyC.t1 && s % 4 === 3) {
        for (let j = 0; j < 4; j++) at(t + j * (S16 / 4), (m, T) => snareHard(m, T, 0.2));
      }
    }
  }
  // 「死の淵」ではリズム隊を抜いて、次のノイズの場面で一気に戻す
  at(zoomC.t0, (m, T) => impact(m, T, 0.5));
  at(heavyC.t0 - 1.0, (m, T) => riser(m, T, 1.0, 0.4));
  at(heavyC.t0, (m, T) => crash(m, T, 0.45));
  // 最後の叩きつけに向けて小太鼓と太鼓を詰めていく
  for (let t = g2End - BAR; t < g2End; t += S16) {
    const k = 1 - (g2End - t) / BAR;
    at(t, (m, T) => snareHard(m, T, 0.25 + 0.4 * k));
    if (Math.round((t - (g2End - BAR)) / S16) % 2 === 0) at(t, (m, T) => tom(m, T, 90 + 120 * k, 0.4));
  }
  // タイトルへ向けて一気に盛り上げる
  const rs = textAt(lastSlam) + 0.1;
  at(rs, (m, T) => riser(m, T, titleC.t0 - rs, 0.45));
  for (let t = rs + 0.2; t < titleC.t0; t += S16 / 2) {
    const k = (t - rs) / (titleC.t0 - rs);
    at(t, (m, T) => snareHard(m, T, 0.15 + 0.4 * k));
    at(t, (m, T) => kickHard(m, T, 0.4 + 0.5 * k));
  }

  // --- タイトル：衝撃＋銅鑼＋三味線のかき鳴らし→重いビートで押し切る ---
  at(titleC.t0, (m, T) => impact(m, T, 1.25));
  at(titleC.t0, (m, T) => gong(m, T, 0.9));
  at(titleC.t0, (m, T) => crash(m, T, 0.5));
  at(titleC.t0, (m, T) => stab(m, T, NOTE.D2 * 2, 1.4, 0.22));
  at(titleC.t0, (m, T) => pad(m, T, [NOTE.D3, NOTE.A3, NOTE.Bb3, NOTE.D4], titleC.dur + 0.6, 0.05, 1200));
  for (let i = 0; i < 12; i++) at(titleC.t0 + 0.35 + i * 0.06, (m, T) => eShamisen(m, T, i % 2 ? NOTE.A4 : NOTE.D5, 0.2 - i * 0.01));
  const tb = titleC.t0 + BAR;
  for (let b = 0; tb + b * BAR < endC.t0 - 0.05; b++) {
    const bt = tb + b * BAR;
    drumBar(bt, { heavy: true, taikoAmp: 0.9, crashOn: b === 0, fill: tb + (b + 1) * BAR >= endC.t0 - 0.05 });
    at(bt, (m, T) => reese(m, T, NOTE.D2, BAR * 0.5, 0.3));
    at(bt + BAR * 0.5, (m, T) => reese(m, T, NOTE.D2 * 1.5, BAR * 0.5, 0.3));
    for (let s = 0; s < 16; s += 2) at(bt + s * S16, (m, T) => bassHard(m, T, NOTE.D2 * (s % 8 === 6 ? 2 : 1), S16 * 0.9, 0.14));
    for (const s of [0, 3, 6, 10]) at(bt + s * S16, (m, T) => stab(m, T, NOTE.D2 * 2, S16 * 2.2, 0.15));
  }

  // --- 最後のカード：一度静かにして溜め→好評発売中で一撃 ---
  const badge = endC.t0 + 3.0;
  at(endC.t0, (m, T) => crash(m, T, 0.3));
  at(endC.t0, (m, T) => pad(m, T, [NOTE.D2, NOTE.A2, NOTE.D3], endC.dur + 0.5, 0.05, 600));
  for (let i = 0; i < 8; i++) {
    const note = arp[i % arp.length] / 2;
    at(endC.t0 + 0.2 + i * 0.25, (m, T) => pluck(m, T, note, 0.14, 0, 2600));
    if (i % 2 === 0) at(endC.t0 + 0.2 + i * 0.25, (m, T) => lowEcho(m, T, note / 2, 0.18));
  }
  at(badge - 0.75, (m, T) => riser(m, T, 0.75, 0.45));
  for (let i = 0; i < 10; i++) at(badge - 0.75 + i * 0.075, (m, T) => tom(m, T, 110 + i * 14, 0.3 + i * 0.04));
  at(badge, (m, T) => impact(m, T, 1.2));
  at(badge, (m, T) => gong(m, T, 0.8));
  at(badge, (m, T) => crash(m, T, 0.5));
  at(badge, (m, T) => stab(m, T, NOTE.D2 * 2, 1.6, 0.2));
  at(badge, (m, T) => pad(m, T, [NOTE.D3, NOTE.A3, NOTE.D4], 2.6, 0.06, 1600));
  at(badge + 0.05, (m, T) => eShamisen(m, T, NOTE.D4, 0.25, 1));
  at(badge + 0.05, (m, T) => pluck(m, T, NOTE.A4, 0.25));

  return ev.sort((a, b) => a.t - b.t);
}

// 先読みスケジューラ（少し先までの音だけを順に予約していく）
function pumpMusic(m) {
  const horizon = audioCtx.currentTime + 0.25;
  while (m.idx < m.events.length && m.start + m.events[m.idx].t < horizon) {
    const e = m.events[m.idx++];
    e.fn(m, Math.max(audioCtx.currentTime, m.start + e.t));
  }
  if (m.idx >= m.events.length && m.timer) {
    clearInterval(m.timer);
    m.timer = null;
  }
}

function stopMusic() {
  if (!music) return;
  if (music.timer) clearInterval(music.timer);
  const { bus, send } = music;
  const now = audioCtx.currentTime;
  bus.gain.setTargetAtTime(0, now, 0.03);
  send.gain.setTargetAtTime(0, now, 0.03);
  setTimeout(() => { bus.disconnect(); send.disconnect(); }, 500);
  music = null;
}

function startMusic() {
  stopMusic();
  const bus = audioCtx.createGain();
  bus.connect(audioComp);
  const send = audioCtx.createGain();
  send.connect(audioReverb);
  const m = { bus, send, start: audioCtx.currentTime + 0.08, events: buildMusicEvents(), idx: 0, timer: null };
  m.timer = setInterval(() => pumpMusic(m), 25);
  pumpMusic(m);
  music = m;
}

// ===== サムネイル（動画の1コマ目に使う1枚絵） =====
const PV_THUMB_TEXT = { tool: 'Claude Code', model: 'Opus 5.5', de: 'で', hero: 'ニンジャスレイヤー', no: 'の', pv: 'PV', rest: '作ってみた' };
let pvThumb = false;

// 割れた月と中心ビルが入る構図に固定する
function pvThumbCamera() {
  camera.position.copy(PV_D_FROM).add(new THREE.Vector3(-12, 4, 10));
  lookTarget.copy(pvDirPoint(PV_D_FROM, pvBaseAz + 0.2, 0.24, 250));
  camera.lookAt(lookTarget);
  angle = Math.atan2(camera.position.z, camera.position.x);
  return { t0: 0, t1: 10, embers: 0.8, fx: 'thumb' };
}

// ロゴとしての組み方：主役（ニンジャスレイヤー）の左右端に3行をそろえた1つのかたまりにする。
// 大きさは主役1：下段0.5：上段0.3、書体は英字Orbitron／主役Dela Gothic／和文の脇役は明朝、色は白・赤・水色の3色まで
function drawThumb() {
  const ctx = pvCtx;
  const W = pvOverlay.width;
  const H = pvOverlay.height;
  const T = PV_THUMB_TEXT;
  ctx.clearRect(0, 0, W, H);

  // 背景：中央を沈めて文字を立たせ、周囲を赤く焼く
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.1, W / 2, H / 2, W * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0.5)');
  vg.addColorStop(0.55, 'rgba(40,0,0,0.3)');
  vg.addColorStop(1, 'rgba(130,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  backing(ctx, W, H * 0.5, H * 0.66, 0.55);

  // 主役の幅を決める（「の」を含めて画面幅の84%に収める）
  let hs = H * 0.17;
  const heroFont = (sz) => `${sz}px 'Dela Gothic One', sans-serif`;
  const noFont = (sz) => `800 ${sz * 0.6}px 'Shippori Mincho B1', serif`;
  const measure = (sz) => {
    ctx.font = heroFont(sz);
    const hw = ctx.measureText(T.hero).width;
    ctx.font = noFont(sz);
    const nw = ctx.measureText(T.no).width;
    return { hw, nw, total: hw + sz * 0.06 + nw };
  };
  let m = measure(hs);
  if (m.total > W * 0.84) { hs *= (W * 0.84) / m.total; m = measure(hs); }
  const left = W / 2 - m.total / 2;
  const right = left + m.total;
  const gap = hs * 0.26;
  const rule = Math.max(2, hs * 0.035);

  // 主役：ニンジャスレイヤー＋の（中心線をそろえる）
  const cy = H * 0.5;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = heroFont(hs);
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#00e5ff';
  ctx.fillText(T.hero, left - hs * 0.03, cy);
  ctx.globalAlpha = 1;
  const grad = ctx.createLinearGradient(0, cy - hs / 2, 0, cy + hs / 2);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.45, '#ffd2c2');
  grad.addColorStop(1, '#ff2a1a');
  outlined(ctx, T.hero, left, cy, hs, grad, 'rgba(255,20,20,1)', hs * 0.35);
  ctx.font = noFont(hs);
  outlined(ctx, T.no, left + m.hw + hs * 0.06, cy + hs * 0.12, hs * 0.6, '#ffffff', 'rgba(0,0,0,0.8)', hs * 0.1);

  // 上段：Claude Code Opus 5.5 で（主役の左端にそろえ、残りを赤い細線で主役の右端まで埋める）
  const ts = hs * 0.3;
  const y1 = cy - hs / 2 - gap - ts / 2;
  const topParts = [
    [T.tool, `700 ${ts}px 'Orbitron', sans-serif`, '#8ff4ff', 'rgba(60,230,255,0.95)', ts * 0.45],
    [` ${T.model}`, `500 ${ts}px 'Orbitron', sans-serif`, '#ffffff', 'rgba(0,0,0,0.8)', ts * 0.2],
    [` ${T.de}`, `800 ${ts * 0.95}px 'Shippori Mincho B1', serif`, '#ffffff', 'rgba(0,0,0,0.8)', ts * 0.2],
  ];
  let x = left;
  for (const [t, f, fill, glow, blur] of topParts) {
    ctx.font = f;
    outlined(ctx, t, x, y1, ts, fill, glow, blur);
    x += ctx.measureText(t).width;
  }
  ctx.fillStyle = '#e0102a';
  ctx.fillRect(x + ts * 0.5, y1 - rule / 2, right - (x + ts * 0.5), rule);

  // 下段：PV作ってみた（主役の右端にそろえ、左側を赤い細線で主役の左端まで埋める）
  const bs = hs * 0.5;
  const y3 = cy + hs / 2 + gap + bs / 2;
  const botParts = [
    [T.pv, `700 ${bs}px 'Orbitron', sans-serif`, '#ff3b30', 'rgba(255,20,10,0.95)', bs * 0.45],
    [T.rest, `800 ${bs}px 'Shippori Mincho B1', serif`, '#ffffff', 'rgba(0,0,0,0.8)', bs * 0.2],
  ];
  const botW = botParts.map(([t, f]) => { ctx.font = f; return ctx.measureText(t).width; });
  const pvGap = bs * 0.12;
  x = right - (botW[0] + pvGap + botW[1]);
  ctx.fillStyle = '#e0102a';
  ctx.fillRect(left, y3 - rule / 2, x - bs * 0.5 - left, rule);
  botParts.forEach(([t, f, fill, glow, blur], i) => {
    ctx.font = f;
    outlined(ctx, t, x, y3, bs, fill, glow, blur);
    x += botW[i] + (i === 0 ? pvGap : 0);
  });
}

// サムネイルを描いて data URL で返す（t は街の点滅などの時刻）
function pvRenderThumb(t = 20, type = 'image/png') {
  pvThumb = true;

  animate();
  pvRenderCtx.drawImage(renderer.domElement, 0, 0, pvRenderCanvas.width, pvRenderCanvas.height);
  pvRenderCtx.drawImage(pvOverlay, 0, 0, pvRenderCanvas.width, pvRenderCanvas.height);

}

// ===== 動画の書き出し（PV_RENDER） =====
let pvVirtualMs = 0;
let pvRenderCanvas = null;

// 指定時刻 t 秒の1コマを描き、JPEGのdata URLを返す
function pvRenderFrame(t) {
  pvVirtualMs = 1e6 + t * 1000;
  animate();
  pvRenderCtx.drawImage(renderer.domElement, 0, 0, pvRenderCanvas.width, pvRenderCanvas.height);
  pvRenderCtx.drawImage(pvOverlay, 0, 0, pvRenderCanvas.width, pvRenderCanvas.height);
  return pvRenderCanvas.toDataURL('image/jpeg', 0.93);
}
let pvRenderCtx = null;

function encodeWav(buf) {
  const ch = buf.numberOfChannels;
  const len = buf.length;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * ch * 2, true);
  out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, len * ch * 2, true);
  const data = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  let o = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < ch; c++) {
      const v = Math.max(-1, Math.min(1, data[c][i]));
      out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      o += 2;
    }
  }
  return new Uint8Array(out.buffer);
}

// 曲を実時間を待たずに一気に合成し、WAVをbase64で返す
async function pvRenderAudio(seconds) {
  const sr = 48000;
  const off = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  initAudio(off);
  const bus = off.createGain();
  bus.connect(audioComp);
  const send = off.createGain();
  send.connect(audioReverb);
  const m = { bus, send };
  for (const e of buildMusicEvents()) e.fn(m, e.t);
  const wav = encodeWav(await off.startRendering());
  let bin = '';
  for (let i = 0; i < wav.length; i += 0x8000) bin += String.fromCharCode.apply(null, wav.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function setupPVRender() {
  // 時計を仮想時刻に差し替える（映像内の点滅・雨・カメラ・文字演出がすべてこの時刻で進む）
  pvVirtualMs = 1e6;
  Date.now = () => pvVirtualMs;
  performance.now = () => pvVirtualMs;
  pvStart = 1e6;
  pvRenderCanvas = document.createElement('canvas');
  pvRenderCanvas.width = renderer.domElement.width;
  pvRenderCanvas.height = renderer.domElement.height;
  pvRenderCtx = pvRenderCanvas.getContext('2d');
  window.pvRenderFrame = pvRenderFrame;
  window.pvRenderAudio = pvRenderAudio;
  window.pvRenderThumb = pvRenderThumb;
  window.pvDuration = PV_END;
  window.pvCards = PV_CARDS.map((c) => ({ t0: c.t0, dur: c.dur, fx: c.fx || (c.title ? 'title' : 'end') }));
  window.pvReady = true;
}

async function setupPV() {
  document.title = 'ニンジャスレイヤー Neo-Saitama in flames - PV';
  pvOverlay = document.createElement('canvas');
  pvOverlay.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2';
  document.body.appendChild(pvOverlay);
  pvCtx = pvOverlay.getContext('2d');
  resizePVOverlay();

  const moonR = 64;
  const moon = makeBrokenMoon(moonR);
  moon.position.copy(pvDirPoint(PV_D_FROM, pvBaseAz + 0.36, 0.16, 1100));
  moon.lookAt(PV_D_FROM);
  moon.rotateY(0.55);
  moon.rotateZ(0.35);
  scene.add(moon);

  scene.add(camera);
  pvEmbers = makeEmbers();

  const ui = document.createElement('div');
  ui.className = 'ui';
  if (PV_RENDER) ui.style.display = 'none';
  const replay = document.createElement('button');
  replay.textContent = '↻ 最初から';
  replay.onclick = playPV;
  const rec = document.createElement('button');
  rec.textContent = '● 録画して保存';
  rec.onclick = () => startPVRecording(ui);
  const back = document.createElement('a');
  back.textContent = '通常モード';
  back.href = 'index.html';
  ui.append(replay, rec, back);
  document.body.appendChild(ui);
  window.addEventListener('keydown', (e) => { if (e.key === 'r' && !pvRecorder) playPV(); });

  if (window.PV_COVER_DATA_URL) {
    const img = new Image();
    img.src = window.PV_COVER_DATA_URL;
    const decoded = img.decode().then(() => { pvCover = img; }).catch(() => {});
    if (PV_RENDER) await decoded;
  }

  const narration = PV_CARDS.flatMap((c) => c.rows || []).join('') + 'ニンジャスレイヤー' + NOISE_GLYPHS + Object.values(PV_THUMB_TEXT).join('');
  await Promise.race([
    Promise.all([
      document.fonts.load("600 40px 'Shippori Mincho B1'", narration),
      document.fonts.load("800 40px 'Shippori Mincho B1'", narration),
      document.fonts.load("40px 'Dela Gothic One'", narration),
      document.fonts.load("40px 'DotGothic16'", narration),
      document.fonts.load("700 40px 'Orbitron'", 'Claude Code PV'),
      document.fonts.load("500 40px 'Orbitron'", 'Neo-Saitama in flames ARCHIVE 01 // WORLD NETWORK FAN-MADE TRAILER Made with Claude Code Opus 5.5 PV'),
    ]),
    new Promise((r) => setTimeout(r, 5000)),
  ]);

  if (PV_RENDER) {
    await setupPVRender();
    return;
  }

  const start = document.createElement('button');
  start.textContent = '▶ 再生（音が出ます）';
  start.style.cssText = [
    'position:fixed', 'left:50%', 'top:50%', 'transform:translate(-50%,-50%)', 'z-index:4',
    "font:700 22px/1 'Shippori Mincho B1',serif", 'color:#fff', 'letter-spacing:0.1em',
    'background:rgba(120,0,0,0.55)', 'border:1px solid rgba(255,90,70,0.8)', 'border-radius:8px',
    'padding:18px 30px', 'cursor:pointer', 'box-shadow:0 0 30px rgba(255,40,20,0.5)',
  ].join(';');
  start.onclick = () => { start.remove(); playPV(); };
  document.body.appendChild(start);
  rec.addEventListener('click', () => start.remove());
}

if (PV_MODE) {
  setupPV();
} else {
  const ui = document.createElement('div');
  ui.className = 'ui';
  const pv = document.createElement('a');
  pv.textContent = '▶ PVを見る';
  pv.href = 'index.html?pv';
  ui.append(pv);
  document.body.appendChild(ui);
}

// カメラの自動旋回（時間経過でランダムに距離・高さ・注視点を変えて、いろんな角度から街を見せる）
let angle = 0;
let camRadius = 240, camHeight = 60, camLookY = 100, camSpeed = 0.0015;
let camTargetRadius = camRadius, camTargetHeight = camHeight, camTargetLookY = camLookY, camTargetSpeed = camSpeed;
let nextShotAt = 0;
const clock = new THREE.Clock();

function pickNewCameraShot(now) {
  camTargetRadius = 140 + Math.random() * 240;   // 近め〜かなり引いたロング
  camTargetHeight = 35 + Math.random() * 140;    // 低め（street level寄り）〜高め（見下ろし）
  camTargetLookY = 45 + Math.random() * 150;     // 注視点の高さもランダム
  camTargetSpeed = 0.0006 + Math.random() * 0.0026;
  nextShotAt = now + 14000 + Math.random() * 18000; // 14〜32秒ごとに次のアングルへ
}
pickNewCameraShot(0);

function animate() {
  if (!PV_RENDER) requestAnimationFrame(animate);
  // 書き出しでサムネイルの後に時刻が巻き戻ることがあるため、負にならないようにする
  const dt = Math.max(0, Math.min(clock.getDelta(), 0.05));
  const now = Date.now();

  let pt = 0;
  let pvSeg = null;
  if (PV_MODE) {
    const rawPt = music ? Math.max(0, audioCtx.currentTime - music.start)
      : pvStart === null ? 0 : (performance.now() - pvStart) / 1000;
    if (pvRecorder && pvRecorder.state === 'recording' && rawPt >= PV_END + 0.3) pvRecorder.stop();
    pt = Math.min(rawPt, PV_END - 0.001);
    pvSeg = pvThumb ? pvThumbCamera() : updatePVCamera(pt);
    const cardK = clamp01((pt - pvSeg.t0) / 0.3) * clamp01((pvSeg.t1 - pt) / 0.6);
    bloomPass.strength = 0.95 + (pvSeg.title ? 0.6 : pvSeg.fx === 'slam' ? 0.3 : 0) * cardK;
    if (pvEmbers) pvEmbers.update(dt, (pvSeg.embers || 0) * cardK);
  } else {
    if (now > nextShotAt) pickNewCameraShot(now);

    // 現在値を目標値へゆっくりイーズ（急に切り替わらないように）
    const ease = 1 - Math.pow(0.02, dt);
    camRadius += (camTargetRadius - camRadius) * ease;
    camHeight += (camTargetHeight - camHeight) * ease;
    camLookY += (camTargetLookY - camLookY) * ease;
    camSpeed += (camTargetSpeed - camSpeed) * ease;

    angle += camSpeed;
    camera.position.x = Math.cos(angle) * camRadius;
    camera.position.z = Math.sin(angle) * camRadius;
    camera.position.y = camHeight + Math.sin(angle * 0.5) * 8;
    lookTarget.y = camLookY;
    camera.lookAt(lookTarget);
  }

  // ピント位置はタワー付近に固定しつつカメラ距離に追従
  bokehPass.uniforms['focus'].value = camera.position.distanceTo(lookTarget);

  // 雲をゆっくり流す（テクスチャをスクロールさせるだけなので継ぎ目が出ない）
  cloudCeiling.texture.offset.x += 0.00015 * dt * 30;
  cloudCeiling.texture.offset.y += 0.00006 * dt * 30;

  // 雨を降らせる
  rain.update(dt);

  const t = Date.now();

  // 地面のきらめきレイヤーを互い違いにフェードさせて瞬いているように見せる
  const twinklePhase = Math.sin(t * 0.0004);
  groundTwinkleA.material.opacity = 0.18 + Math.max(0, twinklePhase) * 0.22;
  groundTwinkleB.material.opacity = 0.18 + Math.max(0, -twinklePhase) * 0.22;

  // 航空障害灯の点滅
  for (const b of beacons) {
    const on = Math.floor(t / 700 + b.phase) % 2 === 0;
    b.mesh.material.color.setHex(on ? 0xff2222 : 0x330000);
    if (b.light) b.light.intensity = on ? b.baseIntensity : 0;
  }

  // ネオン看板の明滅（たまにチラつく）
  for (const n of neonSigns) {
    const flicker = Math.sin(t * 0.006 + n.phase) > -0.85;
    n.mesh.material.opacity = flicker ? 0.95 : 0.2;
  }

  // ツェッペリンをカメラの向きに追従させ、常に画面内に見えるようにする
  for (const z of zeppelins) {
    const drift = Math.sin(t * 0.0006 * z.driftSpeed + z.beaconPhase) * z.driftAmp;
    const a = angle + z.angularOffset + drift;
    z.group.position.set(Math.cos(a) * z.radius, z.height + Math.sin(t * 0.0004 + z.beaconPhase) * 5, Math.sin(a) * z.radius);
    z.group.rotation.y = -(a + Math.PI / 2);
    const on = Math.floor(t / 500 + z.beaconPhase) % 2 === 0;
    z.noseLight.material.color.setHex(on ? 0xff2222 : 0x330000);
  }

  // サーチライトを左右にランダムっぽく揺らす（カメラから見て裏側のものだけ見せる）
  const ts = t * 0.001;
  const camDir = new THREE.Vector2(camera.position.x, camera.position.z).normalize();
  for (const s of searchlights) {
    s.group.rotation.x = Math.sin(ts * s.speedX + s.phaseX) * s.ampX;
    s.group.rotation.z = Math.sin(ts * s.speedZ + s.phaseZ) * s.ampZ;

    const facingCamera = s.dir.dot(camDir); // 1に近いほどカメラ側、-1に近いほど裏側
    const backFactor = THREE.MathUtils.clamp((-facingCamera + 0.1) / 0.6, 0, 1);
    s.group.children[0].material.opacity = s.baseOpacity * backFactor;
  }

  // 高架道路の渋滞ライトを曲線に沿ってじりじり進める
  const up = new THREE.Vector3(0, 1, 0);
  for (const hw of highways) {
    for (const lane of hw.lanes) {
      for (const car of lane.cars) {
        car.t += car.speed * dt;
        if (car.t > 1) car.t -= 1;
        const pos = hw.curve.getPointAt(car.t);
        const tangent = hw.curve.getTangentAt(car.t).normalize();
        const normal = new THREE.Vector3().crossVectors(up, tangent).normalize();
        car.mesh.position.copy(pos).addScaledVector(normal, lane.laneOffset);
        car.mesh.position.y += 1.0;
        car.mesh.lookAt(camera.position);
      }
    }
  }

  composer.render();

  if (PV_MODE && pvOverlay) {
    if (pvThumb) drawThumb(); else drawPVOverlay(pt, pvSeg);
    if (pvRecorder && pvRecorder.state === 'recording') {
      pvRecCtx.drawImage(renderer.domElement, 0, 0, pvRecCanvas.width, pvRecCanvas.height);
      pvRecCtx.drawImage(pvOverlay, 0, 0, pvRecCanvas.width, pvRecCanvas.height);
    }
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
  if (pvOverlay) resizePVOverlay();
});
</script>
</body>
